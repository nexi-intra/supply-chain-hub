/* ---------- mouse camera: drag to orbit, scroll to zoom ---------- */
let camYaw = 0, camPitch = 0.6, camDist = 14.5;
let dragging = false, lastMX = 0, lastMY = 0;
addEventListener('mousedown', e => {
  dragging = true; lastMX = e.clientX; lastMY = e.clientY;
  // pointer lock during in-game drags: relative mouse motion means the camera keeps
  // rotating forever — no more hitting the edge of the monitor
  if (G.state === 'play' && e.target === renderer.domElement) {
    try { renderer.domElement.requestPointerLock?.(); } catch (err) {}
  }
});
addEventListener('mousemove', e => {
  if (!dragging) return;
  const locked = document.pointerLockElement === renderer.domElement;
  const dx = locked ? e.movementX : e.clientX - lastMX;
  const dy = locked ? e.movementY : e.clientY - lastMY;
  camYaw   -= dx * 0.0055;
  camPitch  = THREE.MathUtils.clamp(camPitch + dy * 0.0042, 0.32, 1.25);
  lastMX = e.clientX; lastMY = e.clientY;
});
const endDrag = () => {
  dragging = false;
  if (document.pointerLockElement) { try { document.exitPointerLock(); } catch (err) {} }
};
addEventListener('mouseup', endDrag);
addEventListener('blur', endDrag);
addEventListener('wheel', e => { camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.02, 9.5, 24); }, { passive: true });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

/* ============================================================
   SPAWN DIRECTOR
============================================================ */
const BOSS_TIMES = R.BOSS_TIMES;
const BOSS_NAMES = R.BOSS_NAMES;

function showBanner(text, cls = '', sub = '') {
  const b = document.getElementById('banner');
  b.textContent = text;
  if (sub) {
    const s = document.createElement('span');
    s.className = 'bsub';
    s.textContent = sub;
    b.appendChild(s);
  }
  b.className = cls;
  void b.offsetWidth; // restart the CSS animation
  b.classList.add('show');
}

function director(dt) {
  G.spawnAcc += dt;
  // 30-minute pacing: pressure builds slowly and never quite lets up
  const interval = Math.max(0.2, 1.45 - G.t * 0.0011) * (G.event?.id === 'bloodmoon' ? 0.8 : 1);
  while (G.spawnAcc >= interval) {
    G.spawnAcc -= interval;
    const n = 1 + Math.floor(G.t / 240);
    for (let i = 0; i < n; i++) spawnEnemy(R.pickEnemyType(G.t, Math.random(), Math.random()));
  }
  if (G.t > 60) {
    G.eliteTimer -= dt;
    if (G.eliteTimer <= 0) {
      G.eliteTimer = 90;
      spawnEnemy('elite');
      showBanner(T.eliteIncoming, 'elite');
    }
  }
  BOSS_TIMES.forEach((bt, i) => {
    if (G.t >= bt && !G.bossSpawned[bt]) {
      G.bossSpawned[bt] = true;
      const b = spawnEnemy('boss');
      if (b) b.bossName = BOSS_NAMES[i];
      document.getElementById('bossName').textContent = BOSS_NAMES[i];
      showBanner(R.fmt(T.bossAwakens, { name: BOSS_NAMES[i] }));
    }
  });
}

/* ============================================================
   WORLD EVENTS — meteor shower, gold rush, swarm, blood moon
============================================================ */
function startEvent(id) {
  const def = R.EVENTS.find(e => e.id === id);
  G.event = { id, left: def.duration, total: def.duration, acc: 0.6 };
  G.lastEvent = id;
  showBanner(`${def.emoji} ${T.events[id].name}`, 'event', T.events[id].desc);
  Sfx.horn();
  if (id === 'swarm') {
    const n = 24 + Math.min(24, Math.floor(G.t / 60));
    const type = G.t > 600 ? 'runner' : 'grunt';
    for (let k = 0; k < n; k++) {
      const a = k / n * Math.PI * 2;
      spawnEnemy(type, {
        x: THREE.MathUtils.clamp(P.pos.x + Math.cos(a) * 16, -WORLD, WORLD),
        z: THREE.MathUtils.clamp(P.pos.z + Math.sin(a) * 16, -WORLD, WORLD),
      }, true);
    }
  }
}
function endEvent() {
  const name = T.events[G.event.id].name;
  G.event = null;
  G.nextEventAt = R.nextEventTime(G.t, Math.random);
  showToast(R.fmt(T.eventEnds, { name }));
}
function updateEvents(dt) {
  if (G.event) {
    G.event.left -= dt;
    if (G.event.id === 'meteor') {
      G.event.acc -= dt;
      if (G.event.acc <= 0) {
        G.event.acc = 0.5;
        const a = Math.random() * Math.PI * 2, d = Math.random() * 14;
        dropMeteor(P.pos.x + Math.cos(a) * d, P.pos.z + Math.sin(a) * d, 3.2, 80 * (1 + G.t / 900), 1.3, true);
      }
    }
    if (G.event.left <= 0) endEvent();
  } else if (G.t >= G.nextEventAt) {
    const id = R.chooseEvent(G.t, G.lastEvent, Math.random);
    if (R.eventBlockedByBoss(G.t, id)) G.nextEventAt = G.t + 30;
    else startEvent(id);
  }
}

/* ============================================================
   ENEMY UPDATE — with light separation grid
============================================================ */
const grid = new Map();
function gridKey(x, z){ return ((x+200)|0) * 1000 + ((z+200)|0); }

function updateEnemies(dt) {
  grid.clear();
  for (const e of enemies) {
    const k = gridKey(e.mesh.position.x/2, e.mesh.position.z/2);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(e);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const m = e.mesh;
    _v.set(P.pos.x - m.position.x, 0, P.pos.z - m.position.z);
    const distToP = _v.length();
    if (distToP > 0.01) _v.divideScalar(distToP);
    e.slowT -= dt;
    if (e.spawnT > 0) e.spawnT -= dt;
    if (e.stunT > 0) e.stunT -= dt;
    // late-game, runners and bosses outpace a walking player — sprint is the answer
    const chase = e.def.boss ? 1 + G.t/600*0.55
                : e.type === 'runner' ? 1 + Math.min(0.55, G.t/1800*0.55) : 1;
    let spd = e.def.speed * chase * (e.slowT > 0 ? e.slowMult : 1) * (G.event?.id === 'bloodmoon' ? 1.25 : 1);
    if (e.stunT > 0 || e.spawnT > 0) spd = 0;
    if (e.def.ranged) {
      // spitters hang back at range and lob shots
      if (distToP < 9) spd *= -0.7;
      else if (distToP < 15) spd = 0;
      e.shootCd -= dt;
      if (distToP < 19 && e.shootCd <= 0 && eShots.length < 50) {
        e.shootCd = 2.7 + Math.random() * 0.9;
        spawnEShot(e);
      }
    }
    // bomb cubes light a fuse when they reach you — run or jump clear
    if (e.def.bomber && e.spawnT <= 0) {
      if (!e.fuse && distToP < 2.8) e.fuse = 0.9;
      if (e.fuse > 0) {
        spd *= 0.25;
        e.fuse -= dt;
        Sfx.fuse();
        if (e.fuse <= 0) {
          G.blasts.push({ x: m.position.x, z: m.position.z, y: e.gy, r: e.def.blast, hurtsPlayer: true });
          freeEnemy(e);
          enemies.splice(i, 1);
          continue;
        }
      }
    }
    // blink cubes mark a spot near you, then teleport there
    if (e.def.blink && e.spawnT <= 0) {
      if (e.blinkT > 0) {
        spd = 0;
        e.blinkT -= dt;
        if (e.blinkT <= 0) {
          burst(m.position, 0x3fe0d0, 8, 5, 4);
          m.position.x = e.blinkTo.x; m.position.z = e.blinkTo.z;
          burst(m.position, 0x3fe0d0, 8, 5, 4);
          Sfx.blink();
          e.blinkCd = 4 + Math.random() * 2.5;
          e.contactCd = Math.max(e.contactCd, 0.35); // a beat to react after it lands
        }
      } else {
        e.blinkCd -= dt;
        if (e.blinkCd <= 0 && distToP > 6 && distToP < 40) {
          const a = Math.random() * Math.PI * 2, d = 3.5 + Math.random() * 2;
          e.blinkTo = { x: THREE.MathUtils.clamp(P.pos.x + Math.cos(a) * d, -WORLD, WORLD), z: THREE.MathUtils.clamp(P.pos.z + Math.sin(a) * d, -WORLD, WORLD) };
          e.blinkT = 0.6;
          addRing(e.blinkTo, 0x3fe0d0, 1.6, 0.6);
        }
      }
    }
    m.position.x += _v.x * spd * dt;
    m.position.z += _v.z * spd * dt;
    m.rotation.y = Math.atan2(_v.x, _v.z);

    const k = gridKey(m.position.x/2, m.position.z/2);
    const cell = grid.get(k);
    if (cell) for (const o of cell) {
      if (o === e) continue;
      const dx = m.position.x - o.mesh.position.x, dz = m.position.z - o.mesh.position.z;
      const d2 = dx*dx + dz*dz, rr = (e.def.r + o.def.r) * 0.7;
      if (d2 < rr*rr && d2 > 0.0001) {
        const d = Math.sqrt(d2), push = (rr - d) / d * 0.5;
        m.position.x += dx * push; m.position.z += dz * push;
      }
    }

    if (e.kb.lengthSq() > 0.01) {
      m.position.x += e.kb.x * dt;
      m.position.z += e.kb.z * dt;
      e.kb.multiplyScalar(Math.max(0, 1 - dt*8));
    }
    m.position.x = THREE.MathUtils.clamp(m.position.x, -WORLD-10, WORLD+10);
    m.position.z = THREE.MathUtils.clamp(m.position.z, -WORLD-10, WORLD+10);

    // follow terrain (fall fast, scramble up slower) + waddle-hop + hit squash
    e.gy = terrainH(m.position.x, m.position.z);
    e.bob += dt * (9 - Math.min(4, e.def.scale*1.2));
    const targetY = e.gy + Math.abs(Math.sin(e.bob)) * 0.13 * e.def.scale;
    if (m.position.y > targetY + 0.4) m.position.y = Math.max(targetY, m.position.y - 15*dt);
    else m.position.y = targetY; // snap up instantly — never sink below the ground
    m.rotation.z = Math.sin(e.bob) * 0.09;
    const sq = e.flash > 0 ? 1 : 0;
    // spawn-in: pop up out of the ground with a little overshoot
    const grow = e.spawnT > 0 ? 1 - e.spawnT / (e.def.boss ? 0.9 : 0.4) : 1;
    const gk = grow < 1 ? 1 + 2.70158 * (grow - 1) ** 3 + 1.70158 * (grow - 1) ** 2 : 1;
    m.scale.set(e.def.scale * (1 + sq*0.12) * gk, e.def.scale * (1 - sq*0.14) * gk, e.def.scale * (1 + sq*0.12) * gk);

    if (e.flash > 0) e.flash -= dt; // flash & frost tints render via per-instance colors in syncEnemyInstances

    // contact damage — jumping (or standing on a ledge above) clears it
    e.contactCd -= dt;
    if (!e.def.bomber && e.spawnT <= 0 && distToP < (e.def.r + 0.7) && e.contactCd <= 0 && P.invuln <= 0 &&
        (P.pos.y - e.gy) < 0.9 && (e.gy - P.pos.y) < 2.0) {
      e.contactCd = 0.8;
      hurtPlayer(e.def.dmg * dmgScale(), e);
      if (G.state !== 'play') return;
      if (e.hp <= 0) killEnemy(e, i); // Cactus Skin bit back
    }
  }

  if (G.boss) {
    hudBossFill.style.width = Math.max(0, G.boss.hp / G.boss.maxhp * 100) + '%';
  }
}
const hudBossFill = document.getElementById('bossFill');

/* ---------- enemy projectiles (spitters) ---------- */
const eShots = [];
const eShotGeo = new THREE.SphereGeometry(0.3, 8, 8);
const eShotMat = new THREE.MeshBasicMaterial({ color: 0xd06aff });
function spawnEShot(e) {
  const m = new THREE.Mesh(eShotGeo, eShotMat);
  m.position.set(e.mesh.position.x, e.gy + 1.1, e.mesh.position.z);
  scene.add(m);
  const dir = new THREE.Vector3(P.pos.x - e.mesh.position.x, 0, P.pos.z - e.mesh.position.z).normalize();
  eShots.push({ m, dir, life: 3.4, dmg: e.def.dmg * dmgScale() });
}
function updateEShots(dt) {
  for (let i = eShots.length - 1; i >= 0; i--) {
    const s = eShots[i];
    s.life -= dt;
    s.m.position.addScaledVector(s.dir, 11 * dt);
    const ty = terrainH(s.m.position.x, s.m.position.z) + 1.0;
    s.m.position.y += (ty - s.m.position.y) * Math.min(1, dt * 6);
    s.m.rotation.x += dt * 9;
    let dead = s.life <= 0;
    // Bash Orbs swat incoming shots out of the air — orbiting defense!
    if (!dead) {
      for (let k = 0; k < orbMeshes.length; k++) {
        const op = orbMeshes[k].position;
        const dx = op.x - s.m.position.x, dz = op.z - s.m.position.z;
        if (dx*dx + dz*dz < 1.1 && Math.abs(op.y - s.m.position.y) < 1.4) {
          burst(s.m.position, 0xc9a0ff, 5, 4, 2);
          showDamage(s.m.position, T.blocked, '#c9a0ff', 13);
          Sfx.block();
          dead = true;
          scene.remove(s.m);
          eShots.splice(i, 1);
          break;
        }
      }
      if (dead) continue;
    }
    if (!dead && P.invuln <= 0 &&
        Math.hypot(s.m.position.x - P.pos.x, s.m.position.z - P.pos.z) < 0.9 &&
        Math.abs(s.m.position.y - (P.pos.y + 1)) < 1.3) {  // jump over it!
      hurtPlayer(s.dmg);
      dead = true;
    }
    if (dead) {
      burst(s.m.position, 0xd06aff, 4, 3, 2);
      scene.remove(s.m);
      eShots.splice(i, 1);
      if (G.state !== 'play') return;
    }
  }
}

/* ============================================================
   GAME FLOW
============================================================ */
function resetGame() {
  enemies.length = 0;
  for (const t in enemyPools) enemyPools[t].list.length = 0;
  for (const g of gems) { if (g.kind !== 'xp') scene.remove(g.m); }
  gems.length = 0; xpPool.list.length = 0;
  for (const p of projectiles) scene.remove(p.m);
  projectiles.length = 0;
  for (const b of beams) scene.remove(b.m); beams.length = 0;
  for (const r of rings) scene.remove(r.m); rings.length = 0;
  for (const s of eShots) scene.remove(s.m); eShots.length = 0;
  for (const p of puddles) { scene.remove(p.m); p.m.material.dispose(); } puddles.length = 0;
  for (const m of meteors) { scene.remove(m.warn, m.rock); m.warn.material.dispose(); } meteors.length = 0;
  for (const p of particles) p.life = 0;
  for (const s of dmgPool) { s.life = 0; s.el.style.display = 'none'; }
  orbMeshes.forEach(m => orbGroup.remove(m)); orbMeshes = [];
  if (P.mesh) scene.remove(P.mesh);

  for (const pot of pots) scene.remove(pot.m);
  pots.length = 0; potQueue.length = 0;

  const ch = CHARACTERS[chosenChar];
  P.mesh = makePlayerMesh(ch);
  scene.add(P.mesh);
  P.pos.set(0, terrainH(0, 0), 0); P.vy = 0; P.onGround = true; P.wasGround = true;
  // permanent upgrades from the Upgrade Lab apply here
  const mu = save.upgrades;
  P.maxhp = ch.hp + mu.hp * 10; P.hp = P.maxhp; P.baseSpeed = ch.speed;
  P.level = 1; P.xp = 0; P.xpNext = 12;
  P.invuln = 0; P.animT = 0; P.attackT = 0; P.squash = 0;
  P.dmgMult = 1 + mu.dmg * 0.05; P.cdMult = 1; P.magnet = 3.5 * (1 + mu.magnet * 0.08);
  P.armor = 0; P.regen = mu.regen * 0.15; P.crit = 0.05; P.speedMult = 1 + mu.speed * 0.03;
  P.staminaMax = 100 + mu.stamina * 12; P.stamina = P.staminaMax; P.staminaRegen = 18;
  P.sprintMult = 1.65; P.winded = false; P.sprinting = false; P.dustT = 0; P.oobT = 0;
  P.lifesteal = 0; P.thorns = 0; P.extra = 0; P.area = 1; P.revives = 0;
  P.weapons = {}; P.weapons[ch.weapon] = 1; P.passives = {}; P.evolved = {};
  for (const id in W) W[id].timer = 0;
  syncOrbs();

  G.t = 0; G.kills = 0; G.gold = 0; G.gemsBank = 0;
  G.spawnAcc = 0; G.eliteTimer = 60; G.bossSpawned = {}; G.boss = null;
  G.pendingLevelups = 0; G.shake = 0;
  G.combo = 0; G.comboT = 0; G.comboShown = -1;
  G.hitstop = 0; G.hurtUntil = 0; G.banked = false; G.earned = 0;
  G.event = null; G.nextEventAt = R.firstEventTime(Math.random); G.lastEvent = null;
  G.pendingChests = []; G.blasts = []; G.evolutions = 0; G.seenTypes = new Set();
  G._lastPhase = null; G._pill = null;
  camTargetV.set(0, terrainH(0, 0), 0);
  for (let i = 0; i < POT_COUNT; i++) spawnPot();
  document.getElementById('bossWrap').style.display = 'none';
  document.getElementById('chestScr').style.display = 'none';
  document.getElementById('portrait').style.backgroundImage = `url(${HERO_IMG[ch.id].face}), radial-gradient(circle at 35% 30%, #5a4a9a, #1a1336)`;
  refreshWeaponTray();
}

function startGame() {
  Sfx.ensure();
  Music.start();
  resetGame();
  document.getElementById('menu').style.display = 'none';
  document.getElementById('deadScr').style.display = 'none';
  document.getElementById('winScr').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  G.state = 'play';
}

function fmtTime(t) {
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return m + ':' + String(s).padStart(2, '0');
}

function endStatsHTML() {
  const stat = (value, label) => `<div class="endStat glass"><b>${value}</b><span>${label}</span></div>`;
  return stat(fmtTime(G.t), T.statSurvived) + stat(P.level, T.statLevel) + stat(fmtNum(G.kills), T.statKills)
       + stat(fmtNum(G.gemsBank), T.statGems) + stat(G.evolutions, T.statEvolutions)
       + stat('+' + fmtNum(G.earned), `${T.statBanked} · ${T.statTotal} ${fmtNum(save.coins)}`);
}

function gameOver(won) {
  G.state = won ? 'win' : 'dead';
  Music.stop();
  document.getElementById('levelup').style.display = 'none'; // clear a same-frame card screen
  document.getElementById('chestScr').style.display = 'none';
  let record = '';
  if (!G.banked) { // run gold becomes permanent coins
    G.banked = true;
    G.earned = Math.round(G.gold);
    save.coins += G.earned;
    const beaten = R.updateRecord(save, { time: Math.floor(G.t), kills: G.kills, level: P.level });
    if (beaten.time || beaten.kills) record = '🏆 ' + T.newRecord;
    persistSave();
    refreshMenuCoins();
  }
  clearDamageNumbers();
  document.getElementById('hud').style.display = 'none';
  if (won) {
    Sfx.win();
    document.getElementById('winRecord').textContent = record;
    document.getElementById('winStats').innerHTML = endStatsHTML();
    document.getElementById('winScr').style.display = 'flex';
  } else {
    Sfx.die();
    document.getElementById('deadRecord').textContent = record;
    document.getElementById('deadStats').innerHTML = endStatsHTML();
    document.getElementById('deadScr').style.display = 'flex';
  }
}

/* ============================================================
   MENU SETUP
============================================================ */
const HERO_IMG = renderHeroPortraits();
{
  const row = document.getElementById('charRow');
  CHARACTERS.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'charCard glass' + (i === 0 ? ' sel' : '');
    d.innerHTML = `<img class="charImg" src="${HERO_IMG[c.id].full}" alt=""><div class="charName">${c.name}</div><div class="charTitle">${T.heroTitles[c.id]}</div><div class="charDesc">${T.characters[c.id]}</div>`;
    d.onclick = () => {
      chosenChar = i;
      document.querySelectorAll('.charCard').forEach(el => el.classList.remove('sel'));
      d.classList.add('sel');
      Sfx.pick();
    };
    row.appendChild(d);
  });
  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('retryBtn').onclick = startGame;
  document.getElementById('winBtn').onclick = startGame;
}

/* ============================================================
   UPGRADE LAB (shop) — spend banked coins on permanent upgrades
============================================================ */
function refreshMenuCoins() {
  document.getElementById('menuCoins').textContent = '🪙 ' + R.fmt(T.coins, { n: fmtNum(save.coins) });
  const best = save.best;
  document.getElementById('menuBest').textContent = best && best.time
    ? '🏆 ' + R.fmt(T.best, { time: fmtTime(best.time), kills: fmtNum(best.kills), level: best.level })
    : T.noBest;
}
let shopReturn = 'menu';
function renderShop() {
  document.getElementById('shopCoins').textContent = '🪙 ' + R.fmt(T.coins, { n: fmtNum(save.coins) });
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  for (const meta of META) {
    const lvl = save.upgrades[meta.id];
    const cost = metaCost(meta);
    const maxed = lvl >= meta.max;
    const div = document.createElement('div');
    div.className = 'metaCard glass';
    div.innerHTML = `<div class="upEmoji">${meta.emoji}</div><div class="upName">${T.meta[meta.id].name}</div>
      <div class="mdesc">${T.meta[meta.id].desc}</div>
      <div class="pips">${'●'.repeat(lvl)}<span class="off">${'●'.repeat(meta.max - lvl)}</span></div>
      <button class="buyBtn" ${maxed || save.coins < cost ? 'disabled' : ''}>${maxed ? T.maxed : fmtNum(cost) + ' 🪙'}</button>`;
    if (!maxed && save.coins >= cost) {
      div.querySelector('.buyBtn').onclick = () => {
        save.coins -= cost;
        save.upgrades[meta.id]++;
        persistSave();
        Sfx.gold();
        renderShop();
        refreshMenuCoins();
      };
    }
    grid.appendChild(div);
  }
}
function openShop(from) {
  shopReturn = from;
  document.getElementById(from).style.display = 'none';
  renderShop();
  document.getElementById('shopScr').style.display = 'flex';
  Sfx.pick();
}
document.getElementById('shopBtn').onclick = () => openShop('menu');
document.getElementById('deadShopBtn').onclick = () => openShop('deadScr');
document.getElementById('winShopBtn').onclick = () => openShop('winScr');
document.getElementById('shopBack').onclick = () => {
  document.getElementById('shopScr').style.display = 'none';
  document.getElementById(shopReturn).style.display = 'flex';
  Sfx.pick();
};
document.getElementById('resetSave').onclick = () => {
  if (!confirm(T.resetConfirm)) return;
  save.coins = 0;
  delete save.best;
  for (const m of META) save.upgrades[m.id] = 0;
  persistSave();
  renderShop();
  refreshMenuCoins();
};
refreshMenuCoins();

// console/test handle: BB.gainXP(50), BB.spawnEnemy('boss'), BB.startEvent('meteor'), ...
window.BB = {
  G, P, R, save, META, LANG, enemies, gainXP, spawnEnemy, startGame, startEvent, dropChest, showChest, showLevelup, applyChoice, hurtPlayer,
  composer, renderer, terrainH, pots, breakPotsNear, spawnPot, persistSave, Music, syncOrbs, colliders, tick: (now) => tick(now),
  fx: () => ({ puddles: puddles.length, meteors: meteors.length, projectiles: projectiles.map(p => p.kind), particles: particles.filter(p => p.life > 0).length }),
};

/* ============================================================
   MAIN LOOP
============================================================ */
const hudTimer = document.getElementById('timer');
const hudKills = document.getElementById('statKills');
const hudGold = document.getElementById('statGold');
const hudPhase = document.getElementById('phase');
const eventPill = document.getElementById('eventPill');
const eventText = document.getElementById('eventText');
const eventFill = document.getElementById('eventFill');
const PHASE_ICON = { dawn: '🌅', day: '☀️', golden: '🌇', dusk: '🌆', night: '🌙' };
// soft glowing ring under the hero so you never lose yourself in the horde (or the dark)
const playerRing = new THREE.Mesh(new THREE.RingGeometry(0.75, 1.0, 40), new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
playerRing.rotation.x = -Math.PI / 2;
playerRing.visible = false;
scene.add(playerRing);
const gradeTint = new THREE.Vector3(1, 1, 1), gradeTarget = new THREE.Vector3();
const hudXp = document.getElementById('xpbar');
const hudLvl = document.getElementById('lvlBadge');
const hudHpFill = document.getElementById('hpFill');
const hudHpText = document.getElementById('hpText');
const hudStam = document.getElementById('stamFill');
const hudStamOuter = document.getElementById('stamOuter');
const comboEl = document.getElementById('combo');
const vignetteEl = document.getElementById('vignette');
const camTargetV = new THREE.Vector3(0, 0, 0);
let fovCur = 55;

let last = performance.now();

// adaptive resolution: if real frame times climb (weak GPU + heavy horde),
// step the render resolution down a notch; recover when things calm down
let realLast = performance.now(), ftAvg = 16, qualCooldown = 300;
function setQuality(r) {
  pxRatio = Math.max(1.0, Math.min(Math.min(devicePixelRatio, 1.5), r));
  renderer.setPixelRatio(pxRatio);
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(pxRatio);
  composer.setSize(innerWidth, innerHeight);
}
function loop(now) {
  requestAnimationFrame(loop);
  const rd = now - realLast; realLast = now;
  if (rd < 250) ftAvg = ftAvg * 0.96 + rd * 0.04; // ignore tab-switch gaps
  if (--qualCooldown <= 0) {
    if (ftAvg > 24 && pxRatio > 1.01) { setQuality(pxRatio - 0.25); qualCooldown = 240; }
    else if (ftAvg < 12.5 && pxRatio < Math.min(devicePixelRatio, 1.5) - 0.01) { setQuality(pxRatio + 0.25); qualCooldown = 600; }
    else qualCooldown = 60;
  }
  tick(now);
}
// the whole simulation step — also exposed as BB.tick for scripted testing
function tick(now) {
  let dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  const wt = now / 1000;
  if (G.hitstop > 0) { G.hitstop -= dt; dt *= 0.2; } // crit slow-mo blink

  if (G.state === 'play') {
    G.t += dt;

    /* --- player movement (camera-relative, cliff-aware) --- */
    let mx = 0, mz = 0;
    if (keys.KeyW || keys.ArrowUp) mz -= 1;
    if (keys.KeyS || keys.ArrowDown) mz += 1;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1;
    if (keys.KeyD || keys.ArrowRight) mx += 1;
    const moving = !!(mx || mz);
    P.movingNow = moving;

    // sprint: hold SHIFT for a burst of speed, gated by stamina
    const wantSprint = (keys.ShiftLeft || keys.ShiftRight) && moving;
    P.sprinting = wantSprint && !P.winded && P.stamina > 0;
    if (P.sprinting) {
      P.stamina -= 30 * dt;
      if (P.stamina <= 0) { P.stamina = 0; P.winded = true; }
      P.dustT -= dt;
      if (P.onGround && P.dustT <= 0) { P.dustT = 0.13; burst(P.pos, 0xcfc4a8, 1, 2.2, 1.6); }
    } else {
      P.stamina = Math.min(P.staminaMax, P.stamina + P.staminaRegen * dt);
      // run the tank dry and you're locked out until it refills COMPLETELY —
      // ease off shift early if you want sprint on tap
      if (P.winded && P.stamina >= P.staminaMax) P.winded = false;
    }

    if (moving) {
      const len = Math.hypot(mx, mz);
      mx /= len; mz /= len;
      // rotate input into camera space: W always runs away from the camera
      const fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw);
      const wx = -fwdZ * mx + fwdX * -mz;
      const wz =  fwdX * mx + fwdZ * -mz;
      const step = playerSpeed() * (P.sprinting ? P.sprintMult : 1) * dt;
      // per-axis cliff blocking: grounded movement is slope-limited (no walking up
      // cliff faces); airborne movement only needs vertical clearance (jump up ledges)
      const canPass = (nx2, nz2) => {
        const th = terrainH(nx2, nz2);
        return P.onGround ? (th - P.pos.y) < step * 1.2 : th <= P.pos.y + 0.55;
      };
      // the boundary is soft: you CAN cross the wall (±WORLD), but only so far
      const nx = THREE.MathUtils.clamp(P.pos.x + wx * step, -WORLD - 40, WORLD + 40);
      if (canPass(nx, P.pos.z)) P.pos.x = nx;
      const nz = THREE.MathUtils.clamp(P.pos.z + wz * step, -WORLD - 40, WORLD + 40);
      if (canPass(P.pos.x, nz)) P.pos.z = nz;
      P.facing.set(wx, 0, wz);
      P.mesh.rotation.y = Math.atan2(wx, wz);
    }
    resolveWorldCollisions(); // trees and boulders are solid

    // ground following, ledges, jumping
    const gh = terrainH(P.pos.x, P.pos.z);
    if (P.onGround) {
      if (gh < P.pos.y - 0.35) { P.onGround = false; P.vy = 0; } // walked off a ledge
      else P.pos.y = gh;
    }
    if (keys.Space && P.onGround) { P.vy = 9.5; P.onGround = false; Sfx.jump(); }
    if (!P.onGround) {
      P.vy -= 26 * dt;
      P.pos.y += P.vy * dt;
      if (P.vy <= 0 && P.pos.y <= gh) { P.pos.y = gh; P.vy = 0; P.onGround = true; }
    }
    P.mesh.position.copy(P.pos);

    animatePlayer(dt, moving);

    // invuln flash
    if (P.invuln > 0) {
      P.invuln -= dt;
      P.mesh.visible = Math.floor(G.t * 18) % 2 === 0;
    } else P.mesh.visible = true;

    // regen
    if (P.regen > 0) P.hp = Math.min(P.maxhp, P.hp + P.regen * dt);

    // out of bounds: health melts ~10% of max per second until you return
    if (Math.max(Math.abs(P.pos.x), Math.abs(P.pos.z)) > WORLD) {
      P.oobT = (P.oobT || 0) + dt;
      P.hp -= P.maxhp * 0.10 * dt;
      G.hurtUntil = G.t + 0.2; // keep the red vignette burning
      if (P.oobT % 0.9 < dt) { showDamage(P.pos, T.outOfBounds, '#ff4d4d', 20); Sfx.hurt(); }
      checkDeath();
    } else P.oobT = 0;

    /* --- systems --- */
    if (G.state === 'play') { director(dt); updateEvents(dt); updateEnemies(dt); }
    if (G.state === 'play') updateEShots(dt);
    if (G.state === 'play') {  // may have died above
      fireWeapons(dt);
      updateProjectiles(dt);
      updatePuddles(dt);
      updateMeteors(dt);
    }
    if (G.state === 'play') updateBlasts();
    if (G.state === 'play') {
      updateGems(dt);
      updatePots();
      if (G.t >= G.WIN_TIME) gameOver(true);          // win beats a same-frame level-up
      else if (G.pendingChests.length) showChest();
      else if (G.pendingLevelups > 0) showLevelup();
    }

    /* --- HUD (DOM writes only on change) --- */
    const tSec = Math.floor(G.t);
    if (tSec !== G._lastSec) { G._lastSec = tSec; hudTimer.textContent = fmtTime(G.t); }
    if (G.kills !== G._lastKills || G.gold !== G._lastGold) {
      G._lastKills = G.kills; G._lastGold = G.gold;
      hudKills.textContent = fmtNum(G.kills);
      hudGold.textContent = fmtNum(G.gold);
    }
    const phase = R.dayPhase(G.t).id;
    if (phase !== G._lastPhase) { G._lastPhase = phase; hudPhase.textContent = PHASE_ICON[phase] + ' ' + T.phases[phase]; }
    if (G.event) {
      if (G._pill !== G.event.id) {
        G._pill = G.event.id;
        eventPill.className = 'glass on ' + G.event.id;
        eventText.textContent = R.EVENTS.find(ev => ev.id === G.event.id).emoji + ' ' + T.events[G.event.id].name;
      }
      eventFill.style.width = Math.max(0, G.event.left / G.event.total * 100) + '%';
    } else if (G._pill) { G._pill = null; eventPill.className = 'glass'; }
    hudXp.style.width = (P.xp / P.xpNext * 100) + '%';
    if (P.level !== G._lastLvl) { G._lastLvl = P.level; hudLvl.textContent = 'LV ' + P.level; }
    hudHpFill.style.width = Math.max(0, P.hp / P.maxhp * 100) + '%';
    hudHpText.textContent = Math.ceil(Math.max(0, P.hp)) + '/' + P.maxhp;
    hudStam.style.width = (P.stamina / P.staminaMax * 100) + '%';
    hudStamOuter.classList.toggle('winded', P.winded);

    // combo readout
    if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }
    if (G.combo >= 5) {
      comboEl.style.display = 'block';
      comboEl.textContent = G.combo + 'x COMBO';
      if (G.combo !== G.comboShown) {
        G.comboShown = G.combo;
        comboEl.style.transform = 'scale(1.35)';
        setTimeout(() => comboEl.style.transform = 'scale(1)', 80);
      }
    } else comboEl.style.display = 'none';

  }

  /* --- always-running visuals --- */
  updateParticles(G.state === 'play' ? dt : 0);
  updateDamageNumbers(G.state === 'play' ? dt : 0);

  // vignette: hit flash decays, low-HP heartbeat pulses — runs in every state so the
  // red flash can't freeze over pause / level-up / end screens
  if (G.t > G.hurtUntil || G.state !== 'play') {
    const lowHp = G.state === 'play' && P.hp > 0 && P.hp / P.maxhp < 0.25;
    vignetteEl.style.opacity = lowHp ? 0.38 + Math.sin(wt * 7) * 0.22 : 0;
  }

  // pots glow-pulse so they read as "break me"
  potMat.emissiveIntensity = 0.18 + Math.sin(wt * 3.2) * 0.12;
  beaconMat.opacity = 0.22 + Math.sin(wt * 3) * 0.1;
  windUniform.value = wt;
  waterMat.uniforms.uTime.value = wt;
  // day cycle (the menu shows a fixed golden hour), event tint, lantern and hero ring
  applyPalette(G.state === 'menu' ? R.WIN_TIME * 0.6 : G.t);
  cloudMat.color.setHex(R.mixHex(0xffffff, paletteNow.fog, 0.35));
  const ev = G.state === 'play' || G.state === 'pause' || G.state === 'levelup' || G.state === 'chest' ? G.event?.id : null;
  gradeTarget.set(...(ev === 'bloodmoon' ? [1.2, 0.84, 0.84] : ev === 'goldrush' ? [1.08, 1.02, 0.84] : [1, 1, 1]));
  gradeTint.lerp(gradeTarget, 1 - Math.exp(-3 * dt));
  grade.uniforms.uTint.value.copy(gradeTint);
  playerRing.visible = !!P.mesh && G.state !== 'menu';
  if (P.mesh) {
    lantern.position.set(P.pos.x, P.pos.y + 4.5, P.pos.z);
    playerRing.position.set(P.pos.x, Math.max(P.pos.y, terrainH(P.pos.x, P.pos.z)) + 0.07, P.pos.z);
    playerRing.material.opacity = 0.35 + paletteNow.stars * 0.35 + Math.sin(wt * 4) * 0.08;
  }
  // clouds drift slowly across the sky
  for (let i = 0; i < cloudCount; i++) {
    const c = cloudData[i];
    c.x += c.spd * dt;
    if (c.x > WORLD + 80) c.x = -WORLD - 80;
    _cv.set(c.x, c.y, c.z);
    _cq.setFromEuler(_ce.set(0, c.ry, 0));
    _cs.set(c.s, c.sy, c.s * 0.8);
    _cm4.compose(_cv, _cq, _cs);
    clouds.setMatrixAt(i, _cm4);
  }
  clouds.instanceMatrix.needsUpdate = true;
  // drifting motes
  {
    const pos = moteGeo.attributes.position;
    for (let i = 0; i < moteCount; i++) {
      pos.array[i*3+1] = moteBase[i*3+1] + Math.sin(wt*0.6 + i*1.7)*0.5;
      pos.array[i*3]   = moteBase[i*3]   + Math.sin(wt*0.22 + i*0.9)*1.2;
    }
    pos.needsUpdate = true;
  }

  // push instanced pools (enemies, particles, xp gems) to the GPU
  syncEnemyInstances();
  syncParticleInstances();
  syncGemInstances();

  // orbit camera (drag to rotate, scroll to zoom): damped follow + sprint FOV kick
  if (P.mesh) {
    camTargetV.x = damp(camTargetV.x, P.pos.x, 10, dt);
    camTargetV.y = damp(camTargetV.y, P.pos.y, 8, dt);
    camTargetV.z = damp(camTargetV.z, P.pos.z, 10, dt);
  }
  const target = camTargetV;
  G.shake = Math.max(0, G.shake - dt);
  const sx = (Math.random()-0.5) * G.shake * 1.6;
  const sy = (Math.random()-0.5) * G.shake * 1.6;
  // the menu slowly circles the world as a living backdrop
  if (G.state === 'menu') camYaw += dt * 0.05;
  const dist = G.state === 'menu' ? 30 : camDist, pitch = G.state === 'menu' ? 0.42 : camPitch;
  const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
  const cx = target.x + Math.sin(camYaw) * cosP * dist + sx;
  const cz = target.z + Math.cos(camYaw) * cosP * dist + sy;
  let cy = target.y + sinP * dist;
  cy = Math.max(cy, terrainH(cx, cz) + 1.8); // never sink the camera into a hill
  camera.position.set(cx, cy, cz);
  camera.lookAt(target.x, target.y + 1.2, target.z);
  const fovT = (G.state === 'play' && P.sprinting) ? 61 : 55;
  if (Math.abs(fovCur - fovT) > 0.02) {
    fovCur = damp(fovCur, fovT, 6, dt);
    camera.fov = fovCur;
    camera.updateProjectionMatrix();
  }
  sky.position.set(target.x, 0, target.z);
  sun.position.set(target.x + sunDirV.x * 55, Math.max(18, sunDirV.y * 55), target.z + sunDirV.z * 55);
  sun.target.position.set(target.x, 0, target.z);

  composer.render();
}
requestAnimationFrame(loop);
</script>
