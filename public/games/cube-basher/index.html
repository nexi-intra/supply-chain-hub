<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBE BASHER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#ffcf4a; --gold2:#ff9f1c; --red:#ff4d6a; --green:#5ef2a0; --blue:#5ec8ff; --violet:#b48cff;
    --line:rgba(255,255,255,.14);
    --display:'Lilita One','Trebuchet MS',sans-serif; --body:'Nunito','Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0a14;font-family:var(--body)}
  canvas{display:block}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  .glass{background:linear-gradient(180deg,rgba(38,30,74,.74),rgba(14,11,32,.8));border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.09)}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;display:none}
  #topBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}
  #lvlBadge{min-width:58px;height:30px;padding:0 10px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#2a1800;font-family:var(--display);font-size:15px;letter-spacing:1px;background:linear-gradient(180deg,#ffe58a,var(--gold) 55%,var(--gold2));box-shadow:0 3px 0 #8a5400,0 6px 14px rgba(0,0,0,.4)}
  #xpbarWrap{width:min(640px,56vw);height:14px;background:rgba(8,6,20,.72);border:2px solid rgba(255,255,255,.2);border-radius:9px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #xpbar{height:100%;width:0%;background:linear-gradient(90deg,#3fd0ff,var(--green) 60%,#d6ff7a);box-shadow:0 0 14px #5ef2a0aa}
  #topCenter{position:absolute;top:48px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
  #timer{color:#fff;font-family:var(--display);font-size:42px;line-height:1;letter-spacing:2px;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.45)}
  #phase{padding:3px 12px;font-size:13px;font-weight:800;color:#f4ecff;letter-spacing:.5px;border-radius:12px}
  #eventPill{display:none;align-items:center;gap:8px;padding:6px 16px 9px;color:#fff;font-family:var(--display);font-size:16px;letter-spacing:1.5px;position:relative;overflow:hidden}
  #eventPill.on{display:flex;animation:pillIn .4s cubic-bezier(.2,1.6,.4,1)}
  #eventPill.bloodmoon{border-color:#ff5a6e99;box-shadow:0 0 24px #ff2a4a66}
  #eventPill.goldrush{border-color:#ffd23e99;box-shadow:0 0 24px #ffd23e66}
  #eventPill.meteor{border-color:#ff9a4a99;box-shadow:0 0 24px #ff7a2a66}
  #eventPill.swarm{border-color:#9affc899;box-shadow:0 0 24px #5ef2a055}
  #eventBar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
  #eventFill{height:100%;width:100%;background:linear-gradient(90deg,var(--gold),#ff6a3d)}
  @keyframes pillIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  #stats{position:absolute;top:12px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .statChip{padding:5px 12px;color:#fff;font-size:16px;font-weight:800;text-shadow:0 1px 0 #000;display:flex;gap:8px;align-items:center}
  .statChip b{font-family:var(--display);font-weight:400;letter-spacing:1px;min-width:36px;text-align:right}
  #weaponTray{position:absolute;left:16px;top:66px;display:grid;grid-template-columns:repeat(5,54px);gap:6px}
  .wslot{position:relative;width:54px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
  .wslot .wicon{font-size:26px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
  .wslot .lvpips{display:flex;gap:2px}
  .wslot .lvpips i{width:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
  .wslot .lvpips i.on{background:var(--gold);box-shadow:0 0 4px var(--gold)}
  .wslot.evolved{border-color:#ffd23ecc;background:linear-gradient(180deg,rgba(130,86,10,.85),rgba(44,24,4,.88));box-shadow:0 0 16px #ffcf4a77,inset 0 1px 0 rgba(255,255,255,.22)}
  .wslot.ready{animation:readyPulse 1.2s ease-in-out infinite}
  @keyframes readyPulse{0%,100%{box-shadow:0 0 0 #ffcf4a00}50%{box-shadow:0 0 18px #ffcf4add}}
  #passiveTray{position:absolute;left:16px;top:134px;display:flex;flex-wrap:wrap;gap:5px;max-width:300px}
  .pchip{padding:3px 8px;border-radius:9px;color:#fff;font-size:14px;font-weight:800;text-shadow:0 1px 0 #000}
  #bossWrap{position:absolute;top:150px;left:50%;transform:translateX(-50%);width:min(520px,60vw);display:none;padding:8px 14px 10px}
  #bossName{color:#ffd0d6;text-align:center;font-family:var(--display);font-size:17px;letter-spacing:4px;text-shadow:0 2px 0 #000;margin-bottom:5px}
  #bossOuter{height:14px;background:rgba(0,0,0,.7);border:2px solid rgba(0,0,0,.8);border-radius:8px;overflow:hidden}
  #bossFill{height:100%;width:100%;background:linear-gradient(180deg,#ff8a9a,#e8213e 55%,#a0102a);box-shadow:0 0 12px #ff2a4a88;transition:width .15s}
  #playerCard{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px}
  #portrait{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a4a9a,#1a1336) center/cover no-repeat;border:3px solid var(--gold);box-shadow:0 0 14px #ffcf4a55}
  #bars{display:flex;flex-direction:column;gap:6px;width:250px}
  #hpOuter{position:relative;height:22px;background:rgba(0,0,0,.7);border:2px solid rgba(0,0,0,.85);border-radius:12px;overflow:hidden}
  #hpFill{height:100%;width:100%;background:linear-gradient(180deg,#ff9a8a,#ef3a3a 55%,#b81f2a);border-radius:10px}
  #hpText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-size:13px;letter-spacing:1px;text-shadow:0 1px 2px #000}
  #stamOuter{height:9px;background:rgba(0,0,0,.7);border:2px solid rgba(0,0,0,.85);border-radius:6px;overflow:hidden}
  #stamFill{height:100%;width:100%;background:linear-gradient(180deg,#fff08a,#f5b50b);border-radius:4px}
  #stamOuter.winded #stamFill{background:linear-gradient(180deg,#ff8a76,#d8312a)}
  #reviveChip{display:none;font-size:22px;filter:drop-shadow(0 0 6px #fff8)}
  #hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.72);font-size:12.5px;font-weight:700;text-shadow:0 1px 2px #000;white-space:nowrap}
  #toast{position:absolute;bottom:118px;left:50%;transform:translateX(-50%);padding:10px 24px;color:#fff;font-family:var(--display);font-size:24px;letter-spacing:2px;opacity:0;pointer-events:none;white-space:nowrap;z-index:24}
  #toast.show{animation:toastIn 2.6s ease-out forwards}
  #toast.gold{color:var(--gold);border-color:#ffd23eaa;box-shadow:0 0 30px #ffcf4a66}
  @keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px) scale(.9)}10%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
  #flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .45s ease-out}

  /* ---------- damage numbers ---------- */
  .dmg{position:absolute;z-index:5;color:#fff;font-family:var(--display);font-size:17px;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 3px 5px rgba(0,0,0,.6);pointer-events:none;will-change:transform,opacity;letter-spacing:1px}

  /* ---------- screens ---------- */
  .screen{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 35%, rgba(30,18,60,.62), rgba(6,4,14,.9));pointer-events:auto;overflow:auto;padding:24px}
  #menu{background:radial-gradient(ellipse at 50% 50%, rgba(10,6,24,0) 0%, rgba(10,6,24,.28) 50%, rgba(6,4,14,.82) 100%)}
  .title{font-family:var(--display);font-size:96px;line-height:1.05;letter-spacing:6px;background:linear-gradient(180deg,#fff6c4 0%,#ffd23e 45%,#ff9f1c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #8a4400) drop-shadow(0 12px 20px rgba(0,0,0,.65));transform:rotate(-2deg);margin-bottom:6px;animation:floaty 3s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(-1.4deg) translateY(-8px)}}
  .subtitle{color:#efe4ff;font-size:16px;font-weight:800;margin-bottom:14px;letter-spacing:1px;text-shadow:0 2px 8px #000}
  #menuBest{color:#d8ecff;font-size:14px;font-weight:800;margin-bottom:24px;padding:5px 14px;border-radius:12px}
  .charRow{display:flex;gap:18px;margin-bottom:28px}
  .charCard{width:210px;padding:10px 16px 18px;cursor:pointer;text-align:center;border-width:2px;transition:transform .14s,border-color .14s,box-shadow .14s}
  .charCard:hover{transform:translateY(-7px) scale(1.03);border-color:var(--gold)}
  .charCard:hover .charImg{transform:translateY(-6px) rotate(-3deg)}
  .charCard.sel{border-color:var(--green);box-shadow:0 0 26px #5ef2a066,0 14px 30px rgba(0,0,0,.5)}
  .charImg{display:block;width:170px;height:170px;margin:0 auto 2px;background:radial-gradient(circle at 50% 78%,rgba(255,207,74,.32),rgba(255,207,74,0) 58%);filter:drop-shadow(0 10px 10px rgba(0,0,0,.45));transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
  .charCard.sel .charImg{background:radial-gradient(circle at 50% 78%,rgba(94,242,160,.4),rgba(94,242,160,0) 60%)}
  .charTitle{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
  .charEmoji{font-size:54px;margin-bottom:8px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
  .charName{color:#fff;font-family:var(--display);font-size:22px;letter-spacing:2px;margin-bottom:6px}
  .charDesc{color:#d4c8ee;font-size:12.5px;font-weight:600;line-height:1.55}
  .bigBtn{pointer-events:auto;background:linear-gradient(180deg,#ffe06e,#f5a40b 70%,#d98a00);color:#3a2200;font-family:var(--display);font-size:28px;letter-spacing:3px;padding:15px 60px;border:none;border-radius:14px;cursor:pointer;box-shadow:0 5px 0 #8a5400,0 12px 24px #0008;transition:transform .08s,box-shadow .08s}
  .bigBtn:hover{transform:scale(1.05)}
  .bigBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5400,0 6px 14px #0008}
  .controls{margin-top:24px;color:#ddd2f2;font-size:12.5px;font-weight:700;line-height:1.9;text-align:center;text-shadow:0 1px 4px #000;max-width:900px}

  /* ---------- level up & chest cards ---------- */
  #levelup{background:radial-gradient(ellipse at 50% 40%, rgba(16,44,32,.58), rgba(6,4,14,.9))}
  #lvluptitle,#chestTitle{font-family:var(--display);font-size:54px;letter-spacing:4px;margin-bottom:28px;transform:rotate(-1.5deg);background:linear-gradient(180deg,#eaffd0,#5ef2a0 60%,#22b870);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #0a4a20) drop-shadow(0 10px 18px rgba(0,0,0,.6))}
  #chestTitle{background:linear-gradient(180deg,#fff6c4,#ffd23e 50%,#ff9f1c);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #7a3c00) drop-shadow(0 10px 18px rgba(0,0,0,.6));margin-bottom:4px}
  .cardRow{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .upCard{position:relative;width:240px;min-height:290px;padding:22px 18px 16px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;opacity:0;animation:cardIn .35s cubic-bezier(.2,1.6,.4,1) forwards;border-width:2px;transition:transform .12s,box-shadow .12s,border-color .12s}
  .upCard.weapon{border-color:#5ec8ff99}
  .upCard.passive{border-color:#5ef2a099}
  .upCard.evolution{border-color:var(--gold);background:linear-gradient(160deg,rgba(126,82,8,.92),rgba(46,24,6,.94) 60%,rgba(96,42,10,.92));box-shadow:0 0 36px #ffcf4a77}
  .upCard.evolution::before{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.2s linear infinite;pointer-events:none}
  @keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
  .upCard:nth-child(2){animation-delay:.08s}
  .upCard:nth-child(3){animation-delay:.16s}
  .upCard:nth-child(4){animation-delay:.24s}
  @keyframes cardIn{from{opacity:0;transform:translateY(36px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
  .upCard:not(.static):hover{transform:translateY(-9px) scale(1.045);border-color:var(--gold);box-shadow:0 0 28px #ffd23e44,0 16px 34px rgba(0,0,0,.6)}
  .upCard.static{cursor:default;min-height:250px}
  .upEmoji{font-size:52px;margin:6px 0 12px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
  .upName{color:var(--gold);font-family:var(--display);font-size:21px;letter-spacing:1px;margin-bottom:4px}
  .upLvl{color:var(--green);font-size:12px;font-weight:800;letter-spacing:1px;margin-bottom:10px}
  .upDesc{color:#e2d8f6;font-size:13px;font-weight:600;line-height:1.6}
  .upHint{margin-top:10px;color:#ffd98a;font-size:11.5px;font-weight:800}
  .upTag{margin-top:auto;padding-top:12px;font-size:11px;font-weight:800;color:#a89ccc;letter-spacing:3px}
  .upCard.evolution .upTag{color:#ffe08a}
  .ribbon{position:absolute;top:12px;right:-6px;background:linear-gradient(180deg,#ff6a8a,#e8214a);color:#fff;font-family:var(--display);font-size:12px;letter-spacing:1px;padding:3px 10px;border-radius:6px 0 0 6px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
  #chestScr{background:radial-gradient(ellipse at 50% 40%, rgba(80,50,8,.62), rgba(6,4,14,.92))}
  #chestIcon{font-size:96px;margin:4px 0 16px;filter:drop-shadow(0 0 30px #ffcf4a99);animation:chestBounce .9s cubic-bezier(.2,1.6,.4,1)}
  @keyframes chestBounce{0%{transform:scale(.2) rotate(-20deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
  #chestGold{margin:18px 0;color:var(--gold);font-family:var(--display);font-size:28px;letter-spacing:1px;text-shadow:0 2px 0 #000}

  /* ---------- end screens ---------- */
  .endTitle{font-family:var(--display);font-size:66px;letter-spacing:4px;text-shadow:0 4px 0 rgba(0,0,0,.55),0 12px 26px #000;margin-bottom:10px;text-align:center}
  #deadTitle{color:var(--red)}
  #winTitle{color:var(--green);transform:rotate(-2deg)}
  .recordLine{font-family:var(--display);font-size:26px;color:var(--gold);letter-spacing:2px;margin-bottom:12px;min-height:30px;text-shadow:0 2px 0 #000,0 0 18px #ffcf4a88}
  .endStats{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:10px;margin:6px 0 28px}
  .endStat{padding:10px 16px;text-align:center}
  .endStat b{display:block;color:#fff;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:1px}
  .endStat span{color:#c8bce4;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
  #pauseScr .endTitle{color:var(--blue)}
  .pauseHint{color:#e2d8f6;font-size:16px;font-weight:700}
  #vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 180px #a0000088,inset 0 0 80px #60000066;opacity:0;transition:opacity .25s}

  /* ---------- combo counter ---------- */
  #combo{position:absolute;top:100px;right:18px;font-family:var(--display);font-size:32px;color:var(--gold);text-shadow:0 3px 0 #000,0 0 18px #ffd23e66;display:none;transition:transform .1s;z-index:2}

  /* ---------- boss / elite banner ---------- */
  #banner{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) scale(0);font-family:var(--display);font-size:56px;color:#ff5a5a;text-shadow:0 4px 0 #4a0000,0 10px 30px #000;letter-spacing:8px;opacity:0;pointer-events:none;z-index:25;white-space:nowrap}
  #banner.elite{font-size:34px;color:#d18aff;text-shadow:0 3px 0 #38104a,0 8px 22px #000}
  #banner.event{font-size:46px;color:var(--gold);text-shadow:0 4px 0 #6a3000,0 10px 30px #000}
  #banner .bsub{display:block;margin-top:6px;font-family:var(--body);font-weight:800;font-size:16px;letter-spacing:1px;color:#fff;text-shadow:0 2px 6px #000}
  #banner.show{animation:bannerIn 2.8s ease-out forwards}
  @keyframes bannerIn{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}10%{transform:translate(-50%,-50%) scale(1.12);opacity:1}16%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}

  /* ---------- menus & shop ---------- */
  .btnRow{display:flex;gap:14px;align-items:center}
  .bigBtn.secondary{background:linear-gradient(180deg,#b89aff,#7c4ce8 70%,#5c2cc8);color:#1a0a3a;box-shadow:0 5px 0 #2a1060,0 12px 24px #0008;font-size:22px;padding:13px 34px}
  #menuCoins{color:var(--gold);font-family:var(--display);font-size:21px;letter-spacing:1px;text-shadow:0 2px 0 #000;margin-bottom:8px}
  #shopTitle{font-family:var(--display);font-size:54px;letter-spacing:4px;margin-bottom:6px;transform:rotate(-1.5deg);background:linear-gradient(180deg,#f0e4ff,#b48cff 55%,#7c4ce8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #2a1060) drop-shadow(0 10px 20px rgba(0,0,0,.6))}
  #shopCoins{color:var(--gold);font-family:var(--display);font-size:24px;text-shadow:0 2px 0 #000;margin-bottom:22px}
  #shopGrid{display:grid;grid-template-columns:repeat(4,184px);gap:14px;margin-bottom:24px}
  .metaCard{padding:14px 12px;text-align:center;border-width:2px}
  .metaCard .upEmoji{font-size:34px;margin:2px 0 6px}
  .metaCard .upName{font-size:16px}
  .metaCard .mdesc{color:#d4c8ee;font-size:11.5px;font-weight:600;line-height:1.45;min-height:34px;margin:4px 0 8px}
  .pips{letter-spacing:2px;font-size:11px;color:var(--green);margin-bottom:8px}
  .pips .off{color:#3a2f55}
  .buyBtn{font-family:var(--display);font-size:15px;letter-spacing:1px;background:linear-gradient(180deg,#ffe06e,#f5a40b);color:#3a2200;border:none;border-radius:8px;padding:7px 16px;cursor:pointer;box-shadow:0 3px 0 #8a5400}
  .buyBtn:hover{transform:scale(1.05)}
  .buyBtn:disabled{background:#3a3052;color:#776a99;box-shadow:none;cursor:default;transform:none}
  #resetSave{margin-top:10px;color:#8a7fb0;font-size:12px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div id="ui">
  <div id="vignette"></div>
  <div id="flash"></div>

  <div id="hud">
    <div id="topBar"><div id="lvlBadge">LV 1</div><div id="xpbarWrap"><div id="xpbar"></div></div></div>
    <div id="topCenter">
      <div id="timer">0:00</div>
      <div id="phase" class="glass"></div>
      <div id="eventPill" class="glass"><span id="eventText"></span><div id="eventBar"><div id="eventFill"></div></div></div>
    </div>
    <div id="stats">
      <div class="statChip glass">☠️ <b id="statKills">0</b></div>
      <div class="statChip glass">💰 <b id="statGold">0</b></div>
    </div>
    <div id="weaponTray"></div>
    <div id="passiveTray"></div>
    <div id="bossWrap" class="glass"><div id="bossName">BOSS</div><div id="bossOuter"><div id="bossFill"></div></div></div>
    <div id="playerCard" class="glass">
      <div id="portrait"></div>
      <div id="bars">
        <div id="hpOuter"><div id="hpFill"></div><div id="hpText">100/100</div></div>
        <div id="stamOuter"><div id="stamFill"></div></div>
      </div>
      <div id="reviveChip">👼</div>
    </div>
    <div id="combo"></div>
    <div id="banner"></div>
    <div id="toast" class="glass"></div>
    <div id="hint" data-t="hint"></div>
  </div>

  <div class="screen" id="menu" style="display:flex">
    <div class="title">CUBE BASHER</div>
    <div class="subtitle" data-t="subtitle"></div>
    <div id="menuCoins"></div>
    <div id="menuBest" class="glass"></div>
    <div class="charRow" id="charRow"></div>
    <div class="btnRow">
      <button class="bigBtn" id="startBtn" data-t="start"></button>

   LANGUAGE — the Hub passes ?lang=da|en|fi|sv
============================================================ */

/* ============================================================
   AUDIO — tiny procedural synth
============================================================ */
const Sfx = (() => {
  let ctx = null, muted = false;
  const ensure = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); };
  function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    if (muted) return; ensure(); if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  // rate gate: at level 8 a single hammer swing can hit 80+ enemies in one frame —
  // without this, that's 80+ oscillator nodes per swing, which is a real frame killer
  const lastT = {};
  const gate = (key, gap) => {
    const n = performance.now();
    if (n - (lastT[key] || 0) < gap) return false;
    lastT[key] = n;
    return true;
  };
  return {
    ensure,
    getCtx(){ ensure(); return ctx; },
    toggleMute(){ muted = !muted; return muted; },
    hit(){ if (gate('hit', 45)) beep(160 + Math.random()*60, 0.07, 'square', 0.05, -60); },
    crit(){ if (gate('crit', 70)) beep(320, 0.12, 'square', 0.07, -180); },
    gem(){ if (gate('gem', 40)) beep(880 + Math.random()*200, 0.07, 'sine', 0.06, 300); },
    gold(){ if (gate('gold', 70)) beep(1180, 0.09, 'triangle', 0.07, 200); },
    hurt(){ beep(110, 0.22, 'sawtooth', 0.1, -50); },
    levelup(){ beep(523,0.1,'square',0.07); setTimeout(()=>beep(659,0.1,'square',0.07),90); setTimeout(()=>beep(784,0.16,'square',0.08),180); },
    pick(){ beep(660, 0.08, 'triangle', 0.07, 120); },
    boom(){ if (gate('boom', 70)) beep(70, 0.3, 'sawtooth', 0.12, -30); },
    zap(){ if (gate('zap', 70)) beep(1400, 0.08, 'sawtooth', 0.05, -900); },
    block(){ if (gate('block', 55)) beep(620, 0.06, 'triangle', 0.07, -250); },
    bossroar(){ beep(60, 0.5, 'sawtooth', 0.14, 25); setTimeout(()=>beep(50,0.5,'sawtooth',0.14,20),180); },
    die(){ beep(220,0.25,'sawtooth',0.1,-150); setTimeout(()=>beep(140,0.4,'sawtooth',0.1,-100),200); },
    win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'square',0.08),i*140)); },
    jump(){ beep(300, 0.12, 'sine', 0.05, 220); },
    pot(){ if (gate('pot', 60)) { beep(230, 0.07, 'square', 0.09, -130); setTimeout(()=>beep(140, 0.12, 'square', 0.07, -70), 45); } },
    food(){ beep(520, 0.08, 'sine', 0.08, 140); setTimeout(()=>beep(720, 0.11, 'sine', 0.07, 130), 75); },
    chest(){ [392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.14,'triangle',0.08),i*70)); },
    evolve(){ [262,392,523,784,1047,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'square',0.07),i*85)); },
    fuse(){ if (gate('fuse', 140)) beep(950, 0.05, 'square', 0.04); },
    blast(){ if (gate('blast', 60)) beep(55, 0.45, 'sawtooth', 0.14, -20); },
    blink(){ if (gate('blink', 80)) beep(1250, 0.14, 'sine', 0.05, -1050); },
    whistle(){ if (gate('whistle', 160)) beep(1700, 0.45, 'sine', 0.025, -1300); },
    horn(){ beep(196, 0.35, 'sawtooth', 0.08); setTimeout(()=>beep(262, 0.55, 'sawtooth', 0.08), 230); },
    saw(){ if (gate('saw', 90)) beep(420, 0.07, 'sawtooth', 0.03, 220); },
    poison(){ if (gate('poison', 200)) beep(180, 0.18, 'triangle', 0.05, 90); },
    revive(){ [523,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.26,'sine',0.09),i*110)); },
  };
})();

/* ============================================================
   MUSIC — procedural chiptune loop (bass + arp + drums)
============================================================ */
const Music = (() => {
  let gain = null, playing = false, timer = null, step = 0, nextT = 0, noiseBuf = null, muted = false;
  const BPM = 132, SPB = 60/BPM/2; // 8th-note grid
  const bars = [
    { root: 45, arp: [57, 60, 64, 67] },  // Am
    { root: 41, arp: [53, 57, 60, 65] },  // F
    { root: 48, arp: [55, 60, 64, 67] },  // C
    { root: 43, arp: [55, 59, 62, 67] },  // G
  ];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function ensure() {
    const ctx = Sfx.getCtx();
    if (!gain) {
      gain = ctx.createGain();
      gain.gain.value = muted ? 0 : 0.5;
      gain.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 0.25);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
    }
    return ctx;
  }
  function tone(ctx, f, t, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(gain);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(ctx, t, dur, vol, hp) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(gain);
    s.start(t); s.stop(t + dur + 0.02);
  }
  function kick(ctx, t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(gain);
    o.start(t); o.stop(t + 0.2);
  }
  const arpPat = [0, 1, 2, 3, 2, 1, 3, 0];
  function playStep(ctx, t, s) {
    const bar = Math.floor(s / 8) % 4, sub = s % 8;
    const B = bars[bar];
    tone(ctx, mtof(sub % 4 === 2 ? B.root + 7 : B.root), t, 0.22, 'triangle', 0.3);     // bass
    tone(ctx, mtof(B.arp[arpPat[sub]] + 12), t, 0.16, 'square', 0.03);                  // arp sparkle
    if (sub === 0) tone(ctx, mtof(B.arp[(bar + 1) % 4] + 24), t, SPB*4, 'triangle', 0.09); // bell on the downbeat
    if (sub === 0 || sub === 4) kick(ctx, t);
    if (sub === 4) noise(ctx, t, 0.12, 0.12, 1800);   // snare-ish
    if (sub % 2 === 1) noise(ctx, t, 0.04, 0.05, 6000); // hats
  }
  function schedule() {
    if (!playing) return;
    const ctx = ensure();
    while (nextT < ctx.currentTime + 0.35) {
      playStep(ctx, nextT, step);
      step = (step + 1) % 32;
      nextT += SPB;
    }
  }
  return {
    start() {
      const ctx = ensure();
      if (playing) return;
      playing = true; step = 0; nextT = ctx.currentTime + 0.1;
      timer = setInterval(schedule, 120);
      schedule();
    },
    stop() { playing = false; if (timer) { clearInterval(timer); timer = null; } },
    setMuted(m) { muted = m; if (gain) gain.gain.value = m ? 0 : 0.5; },
  };
})();

/* ============================================================
   META-PROGRESSION — coins persist across runs (localStorage)
============================================================ */
const SAVE_KEY = 'cubebasher_v1';
const META = R.META;
const save = (() => {

  try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}

  s.coins = s.coins || 0;
  s.upgrades = s.upgrades || {};
  for (const m of META) s.upgrades[m.id] = s.upgrades[m.id] || 0;
  return s;
})();
function persistSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function metaCost(m) { return Math.round(m.base * Math.pow(1.75, save.upgrades[m.id])); }
const goldMult = () => 1 + save.upgrades.gold * 0.10;

/* ============================================================
   RENDERER / SCENE / POST
============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
let pxRatio = Math.min(devicePixelRatio, 1.5);
renderer.setPixelRatio(pxRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfd8e8, 70, 175);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.7, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());
// storybook grade in display space: a touch more saturation/contrast, soft vignette, event tint
const grade = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uSat: { value: 1.12 }, uContrast: { value: 1.05 }, uVig: { value: 0.34 },
    uTint: { value: new THREE.Vector3(1, 1, 1) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uSat, uContrast, uVig; uniform vec3 uTint; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec3 col = c.rgb;
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, uSat);
      col = (col - 0.5) * uContrast + 0.5;
      col *= uTint;
      float d = length((vUv - 0.5) * vec2(1.15, 1.0));
      col *= 1.0 - uVig * smoothstep(0.32, 0.82, d);
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), c.a);
    }`,
});
composer.addPass(grade);

/* ---------- lights: driven by the day cycle (see applyPalette) ---------- */
const hemi = new THREE.HemisphereLight(0xbdd2ff, 0x5a7a55, 0.72);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe0b3, 2.4);
sun.position.set(25, 45, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 130;
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(sun.target);
// warm lantern around the hero — only lit after dusk
const lantern = new THREE.PointLight(0xffc27a, 0, 18, 1.4);
scene.add(lantern);

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(260, 24, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x3a6ab8) },
      mid: { value: new THREE.Color(0x88aede) },
      bot: { value: new THREE.Color(0xc4cfe0) },
      sunDir: { value: new THREE.Vector3(0.45, 0.5, 0.35).normalize() },
      sunCol: { value: new THREE.Color(0xffd9a0) },
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec3 vP; uniform vec3 top, mid, bot, sunDir, sunCol;
      void main(){
        vec3 d = normalize(vP);
        float h = d.y;
        vec3 c = h > 0.12 ? mix(mid, top, smoothstep(0.12, 0.65, h)) : mix(bot, mid, smoothstep(-0.05, 0.12, h));
        float s = pow(max(dot(d, sunDir), 0.0), 90.0);
        c += sunCol * s * 0.95;                                   // sun / moon disc
        c += sunCol * pow(max(dot(d, sunDir), 0.0), 6.0) * 0.2;   // haze around it
        gl_FragColor = vec4(c, 1.0);
      }`,
  })
);
scene.add(sky);

/* ---------- stars: fade in from dusk ---------- */
const stars = (() => {
  const n = 900, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * Math.PI * 2, v = Math.acos(Math.random() * 0.94);
    arr[i*3] = Math.sin(v) * Math.cos(u) * 240;
    arr[i*3+1] = Math.cos(v) * 240 - 8;
    arr[i*3+2] = Math.sin(v) * Math.sin(u) * 240;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const m = new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  sky.add(p);
  return p;
})();

/* ---------- day cycle: sky, fog, sun/moon, bloom and lantern follow the run clock ---------- */
const sunDirV = new THREE.Vector3(0.45, 0.8, 0.32).normalize();
let paletteNow = R.paletteAt(0);
function applyPalette(t) {
  const p = R.paletteAt(t);

  u.sunDir.value.copy(sunDirV);
  scene.fog.color.setHex(p.fog);
  sun.color.setHex(p.sun); sun.intensity = p.sunIntensity;
  hemi.color.setHex(p.hemiSky); hemi.groundColor.setHex(p.hemiGround); hemi.intensity = p.hemiIntensity;
  stars.material.opacity = p.stars; stars.visible = p.stars > 0.01;
  bloom.strength = p.bloom;
  lantern.intensity = p.stars * 12;
  rimUniform.value.setHex(R.mixHex(0xfff0d0, 0x9fc4ff, p.stars));
  waterMat.uniforms.uSky.value.setHex(R.mixHex(p.skyMid, 0xffffff, 0.4));
  waterMat.uniforms.uDeep.value.setHex(R.mixHex(0x1d6a94, 0x0a1a3a, p.stars * 0.8));
  waterMat.uniforms.uShallow.value.setHex(R.mixHex(0x5fd8d0, 0x2a5a7a, p.stars * 0.7));
  paletteNow = p;
}

addEventListener('resize', () => {

  composer.setSize(innerWidth, innerHeight);

/* ============================================================
   TERRAIN — analytic heightfield: rolling hills + mesas.
   Every entity samples terrainH() to stand on the ground.
============================================================ */
const WORLD = 240; // playable half-extent — big enough that the edge is a real journey
const MESAS = [];
{
  for (let i = 0; i < 40; i++) {
    const a = Math.random()*Math.PI*2, d = 30 + Math.random()*(WORLD - 50);
    const x = Math.cos(a)*d, z = Math.sin(a)*d;
    const tall = Math.random() < 0.4;
    const r = 7 + Math.random()*7;
    MESAS.push({ x, z, r, h: tall ? 2.5 + Math.random()*0.5 : 1.3 + Math.random()*0.45 });
    if (tall) { // a lower step so tall mesas can be climbed in two jumps
      const sa = Math.random()*Math.PI*2;
      MESAS.push({ x: x + Math.cos(sa)*(r + 2.5), z: z + Math.sin(sa)*(r + 2.5), r: 5.5, h: 1.35 });
    }
  }
}
const MESA_EDGE = 1.5;
const hillsH = (x, z) => (Math.sin(x*0.045)*Math.cos(z*0.04) + Math.sin(x*0.021 + z*0.033) + Math.sin(x*0.11)*Math.cos(z*0.09)*0.35)
  * 0.62 * THREE.MathUtils.clamp((Math.hypot(x, z) - 10) / 26, 0, 1);
// lakes: flattened basins away from spawn and mesas; the water surface sits at baseH - 0.45
const LAKES = [];
{
  let tries = 0;
  while (LAKES.length < 9 && tries++ < 400) {
    const a = Math.random()*Math.PI*2, d = 45 + Math.random()*(WORLD - 70);
    const x = Math.cos(a)*d, z = Math.sin(a)*d, r = 7 + Math.random()*7;
    if (MESAS.some(m => Math.hypot(m.x - x, m.z - z) < m.r + r + 6)) continue;
    if (LAKES.some(l => Math.hypot(l.x - x, l.z - z) < l.r + r + 14)) continue;
    LAKES.push({ x, z, r, baseH: hillsH(x, z) });
  }
}
const LAKE_DEPTH = 1.1;
function lakeAt(x, z) {
  for (const l of LAKES) {
    const dx = x - l.x, dz = z - l.z;
    if (Math.abs(dx) > l.r + 3 || Math.abs(dz) > l.r + 3) continue;
    const t = THREE.MathUtils.clamp((l.r + 3 - Math.sqrt(dx*dx + dz*dz)) / 4, 0, 1);
    if (t > 0) return { l, k: t*t*(3 - 2*t) };
  }
  return null;
}
function terrainH(x, z) {
  let h = hillsH(x, z);
  const lake = lakeAt(x, z);
  if (lake) h = h * (1 - lake.k) + (lake.l.baseH - LAKE_DEPTH) * lake.k;
  let mesa = 0;
  for (const m of MESAS) {
    const dx = x - m.x, dz = z - m.z;
    if (Math.abs(dx) > m.r + MESA_EDGE || Math.abs(dz) > m.r + MESA_EDGE) continue;
    const dd = Math.sqrt(dx*dx + dz*dz);
    if (dd < m.r + MESA_EDGE) {
      const t = THREE.MathUtils.clamp((m.r + MESA_EDGE - dd) / MESA_EDGE, 0, 1);
      mesa = Math.max(mesa, m.h * t*t*(3 - 2*t));
    }
  }
  return h + mesa;
}

/* ============================================================
   WORLD COLLIDERS — trees & rocks are solid obstacles for the player.
   Circle colliders in a coarse spatial grid; resolved by push-out.
============================================================ */
const colliders = [];
const collGrid = new Map();
const collCell = (x, z) => (Math.floor((x + 300) / 8)) * 4096 + Math.floor((z + 300) / 8);
function addCollider(x, z, r) {
  const c = { x, z, r };
  colliders.push(c);
  const key = collCell(x, z);
  if (!collGrid.has(key)) collGrid.set(key, []);
  collGrid.get(key).push(c);
}
function resolveWorldCollisions() {
  const pr = 0.55; // player body radius
  const gx0 = Math.floor((P.pos.x + 300) / 8), gz0 = Math.floor((P.pos.z + 300) / 8);
  for (let gx = gx0 - 1; gx <= gx0 + 1; gx++) {
    for (let gz = gz0 - 1; gz <= gz0 + 1; gz++) {

// studio renders of each hero for the character cards and the HUD portrait
function renderHeroPortraits() {
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1);
  r.setSize(256, 256);
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.1;
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xe6ecff, 0x6a5a7a, 1.3));
  const key = new THREE.DirectionalLight(0xfff0d8, 2.8); key.position.set(2, 3, 4); sc.add(key);
  const back = new THREE.DirectionalLight(0x9fd8ff, 2.4); back.position.set(-3, 2, -3); sc.add(back);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
  const out = {};
  for (const ch of CHARACTERS) {
    const hero = makePlayerMesh(ch);
    hero.rotation.y = 0.4;
    sc.add(hero);
    cam.position.set(1.2, 1.8, 4.6); cam.lookAt(0, 1.3, 0);
    r.render(sc, cam);
    const full = r.domElement.toDataURL('image/png');
    cam.position.set(0.55, 2.05, 2.1); cam.lookAt(0, 1.95, 0);
    r.render(sc, cam);
    out[ch.id] = { full, face: r.domElement.toDataURL('image/png') };
    sc.remove(hero);
  }
  r.dispose();
  return out;
}

const P = {
  mesh: null, pos: new THREE.Vector3(), vy: 0, onGround: true, wasGround: true,
  hp: 100, maxhp: 100, baseSpeed: 8, level: 1, xp: 0, xpNext: 10,
  invuln: 0, facing: new THREE.Vector3(0,0,1),
  animT: 0, attackT: 0, squash: 0,
  dmgMult: 1, cdMult: 1, magnet: 3.5, armor: 0, regen: 0, crit: 0.05, speedMult: 1,
  stamina: 100, staminaMax: 100, staminaRegen: 18, sprintMult: 1.65,
  sprinting: false, winded: false, dustT: 0,
  lifesteal: 0, thorns: 0, extra: 0, area: 1, revives: 0,
  weapons: {},   // id -> level
  passives: {},  // id -> times picked
  evolved: {},   // id -> true once evolved
};
function playerSpeed(){ return P.baseSpeed * P.speedMult; }

const damp = (cur, target, l, dt) => THREE.MathUtils.lerp(cur, target, 1 - Math.exp(-l * dt));

function animatePlayer(dt, moving) {
  const rig = P.mesh.userData.rig;
  const speedRatio = playerSpeed() * (P.sprinting ? P.sprintMult : 1) / 8;

  if (!P.onGround) {
    // jump tuck: knees up, arms flung up
    rig.legL.rotation.x = damp(rig.legL.rotation.x, -1.15, 14, dt);
    rig.legR.rotation.x = damp(rig.legR.rotation.x, -0.55, 14, dt);
    rig.armL.rotation.x = damp(rig.armL.rotation.x, -2.5, 12, dt);
    if (P.attackT <= 0) rig.armR.rotation.x = damp(rig.armR.rotation.x, -2.5, 12, dt);
    rig.hips.rotation.x = damp(rig.hips.rotation.x, -0.12, 10, dt);
    rig.hips.position.y = 0.92;
  } else if (moving) {
    // run cycle
    P.animT += dt * 10.5 * Math.max(0.8, speedRatio);
    const s = Math.sin(P.animT);
    rig.legL.rotation.x = s * 0.95;
    rig.legR.rotation.x = -s * 0.95;
    rig.armL.rotation.x = -s * 0.8;
    if (P.attackT <= 0) rig.armR.rotation.x = s * 0.8;
    rig.hips.position.y = 0.92 + Math.abs(Math.cos(P.animT)) * 0.085;
    rig.hips.rotation.x = damp(rig.hips.rotation.x, 0.1 + 0.07 * speedRatio, 10, dt);
    rig.head.rotation.x = -rig.hips.rotation.x * 0.7;
  } else {
    // idle: breathe + tiny sway
    const t = performance.now() / 1000;
    rig.legL.rotation.x = damp(rig.legL.rotation.x, 0, 10, dt);
    rig.legR.rotation.x = damp(rig.legR.rotation.x, 0, 10, dt);
    rig.armL.rotation.x = damp(rig.armL.rotation.x, Math.sin(t*2)*0.07, 8, dt);
    if (P.attackT <= 0) rig.armR.rotation.x = damp(rig.armR.rotation.x, Math.sin(t*2+0.4)*0.07, 8, dt);
    rig.hips.rotation.x = damp(rig.hips.rotation.x, 0, 8, dt);
    rig.hips.position.y = 0.92 + Math.sin(t*2.2)*0.018;
    rig.torso.scale.y = 1 + Math.sin(t*2.2)*0.022;
    rig.head.rotation.x = damp(rig.head.rotation.x, 0, 8, dt);
  }

  // attack swing overrides the right arm: windup behind, slam through
  if (P.attackT > 0) {
    P.attackT -= dt;
    const k = 1 - Math.max(0, P.attackT) / 0.32;
    rig.armR.rotation.x = k < 0.38
      ? THREE.MathUtils.lerp(0.3, -2.7, k/0.38)
      : THREE.MathUtils.lerp(-2.7, 1.25, (k-0.38)/0.62);
  }

  // hero flair: glowing rune/goggles/eyes pulse, fox tail wags, ears perk up
  const ft = performance.now() / 1000;
  if (rig.glow) rig.glow.material.emissiveIntensity = 1.1 + Math.sin(ft * 4) * 0.5;
  if (rig.tail) {
    rig.tail.rotation.y = Math.sin(ft * (moving ? 10 : 3)) * (moving ? 0.5 : 0.25);
    rig.tail.rotation.x = damp(rig.tail.rotation.x, moving ? 0.3 : -0.25, 6, dt);
  }
  if (rig.ears) rig.ears.forEach((ear, i) => { ear.rotation.x = damp(ear.rotation.x, moving ? -0.45 : Math.sin(ft * 2 + i) * 0.1, 8, dt); });

  // cape flutter — lifts with speed, flares on jumps
  rig.cape.rotation.x = 0.14 + (moving ? 0.5 * speedRatio : 0.05) + Math.sin(P.animT * 1.7) * 0.06 + (!P.onGround ? 0.4 : 0);

  // landing squash & stretch
  if (!P.wasGround && P.onGround) {
    P.squash = 0.32;
    burst(P.pos, 0xcfc4a8, 7, 3.5, 2);
  }
  P.wasGround = P.onGround;
  P.squash = Math.max(0, P.squash - dt*2.4);
  const airStretch = P.onGround ? 0 : Math.min(0.18, Math.abs(P.vy)*0.014);
  P.mesh.scale.y = 1 - P.squash*0.38 + airStretch;
  const xz = (1 + P.squash*0.22 - airStretch*0.5) * CHARACTERS[chosenChar].build;
  P.mesh.scale.x = xz; P.mesh.scale.z = xz;
}

  d.className = 'dmg'; d.style.display = 'none';

  dmgPool.push({ el: d, life: 0, wp: new THREE.Vector3(), vy: 0 });
}
function showDamage(worldPos, text, color = '#fff', size = 17) {
  let slot = dmgPool.find(s => s.life <= 0);
  if (!slot) return;
  slot.life = 0.7; slot.vy = 0;
  slot.wp.copy(worldPos); slot.wp.y += 2.2 + Math.random()*0.6;
  slot.wp.x += (Math.random()-0.5)*0.8;
  slot.el.textContent = text;
  slot.el.style.color = color;
  slot.el.style.fontSize = size + 'px';
  slot.el.style.display = 'block';
  slot.el.style.opacity = 1;
}
const _v = new THREE.Vector3();
function updateDamageNumbers(dt) {
  for (const s of dmgPool) {
    if (s.life <= 0) continue;
    s.life -= dt; s.wp.y += dt * 1.6;
    if (s.life <= 0) { s.el.style.display = 'none'; continue; }
    _v.copy(s.wp).project(camera);
    if (_v.z > 1) { s.el.style.display='none'; s.life = 0; continue; }
    const age = 0.7 - s.life, pop = age < 0.12 ? 1.45 - age / 0.12 * 0.45 : 1; // pop in, then drift
    s.el.style.transform = `translate(${(_v.x*0.5+0.5)*innerWidth}px, ${(-_v.y*0.5+0.5)*innerHeight}px) translate(-50%,-50%) scale(${pop.toFixed(2)})`;
    s.el.style.opacity = Math.min(1, s.life / 0.3);
  }
}

// all particles share ONE InstancedMesh — one draw call instead of one per particle.
// fade is scale-based (instances can't have per-instance opacity without custom shaders)
const PART_MAX = 150;
const partGeo = new THREE.BoxGeometry(0.22, 0.22, 0.22);
const partMesh = new THREE.InstancedMesh(partGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }), PART_MAX);
partMesh.frustumCulled = false;
scene.add(partMesh);
const particles = [];
for (let i = 0; i < PART_MAX; i++) {
  particles.push({ idx: i, m: new THREE.Object3D(), life: 0, s0: 1, vel: new THREE.Vector3() });
  partMesh.setColorAt(i, new THREE.Color(0xffffff));
}
function burst(pos, color, n = 8, speed = 5, up = 4) {
  for (let i = 0; i < n; i++) {
    const p = particles.find(p => p.life <= 0);
    if (!p) return;
    p.life = 0.45 + Math.random()*0.25;
    p.m.position.copy(pos); p.m.position.y += 0.8;
    p.vel.set((Math.random()-0.5)*speed, Math.random()*up, (Math.random()-0.5)*speed);
    p.s0 = 0.7 + Math.random()*0.9;
    p.m.scale.setScalar(p.s0);
    partMesh.setColorAt(p.idx, _pc.set(color));
    partMesh.instanceColor.needsUpdate = true;
  }
}
const _pc = new THREE.Color();
function updateParticles(dt) {
  for (const p of particles) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life > 0) {
      p.vel.y -= 14 * dt;
      p.m.position.addScaledVector(p.vel, dt);
      const pg = terrainH(p.m.position.x, p.m.position.z) + 0.1;
      if (p.m.position.y < pg) { p.m.position.y = pg; p.vel.y *= -0.4; p.vel.x *= 0.8; p.vel.z *= 0.8; }

function chunk(geo, color, tx=0, ty=0, tz=0, rx=0, ry=0, rz=0, s=1) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  if (Array.isArray(s)) g.scale(s[0], s[1], s[2]);
  else if (s !== 1) g.scale(s, s, s);

  if (rz) g.rotateZ(rz);
  if (ry) g.rotateY(ry);

  for (let i = 0; i < n; i++) { arr[i*3] = c.r; arr[i*3+1] = c.g; arr[i*3+2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));

}

function buildEnemyTemplate(type) {

// one InstancedMesh per enemy TYPE: the whole horde renders in 6 draw calls

// each enemy keeps a lightweight Object3D (never added to the scene) as its transform,
// so all gameplay code can keep using e.mesh.position/rotation/scale unchanged.
const ENEMY_POOL_MAX = R.ENEMY_POOL_MAX;

const outlineMat = new THREE.MeshBasicMaterial({ color: 0x140a1e, side: THREE.BackSide });
outlineMat.onBeforeCompile = shader => {
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n transformed += normal * 0.05;');
};
for (const t in ENEMY_TYPES) {
  const mesh = new THREE.InstancedMesh(enemyTemplates[t], enemyBaseMat, ENEMY_POOL_MAX[t]);
  mesh.count = 0;
  mesh.frustumCulled = false; // the horde surrounds the player; culling per-type is pointless
  mesh.castShadow = true;
  mesh.setColorAt(0, _ec.setRGB(1, 1, 1)); // allocate the instanceColor buffer
  scene.add(mesh);
  const outline = new THREE.InstancedMesh(enemyTemplates[t], outlineMat, ENEMY_POOL_MAX[t]);
  outline.instanceMatrix = mesh.instanceMatrix; // shares the per-enemy transforms
  outline.count = 0;

  scene.add(outline);

function freeEnemy(e) {

}
function syncEnemyInstances() {
  for (const t in enemyPools) {
    const pool = enemyPools[t], mesh = pool.mesh, n = pool.list.length;
    for (let i = 0; i < n; i++) {
      const e = pool.list[i], o = e.mesh;
      o.updateMatrix();
      mesh.setMatrixAt(i, o.matrix);
      const k = e.tint;
      if (e.flash > 0) _ec.setRGB(2.6, 2.6, 2.6);                       // hit flash (brightens, blooms)
      else if (e.fuse > 0) { if (((e.fuse * 8) | 0) % 2 === 0) _ec.setRGB(2.4, 1.1, 0.5); else _ec.setRGB(k, k, k); } // lit fuse blinks hot
      else if (e.blinkT > 0) _ec.setRGB(0.8, 2.2, 2.2);                 // charging a teleport
      else if (e.stunT > 0) _ec.setRGB(k*1.4, k*1.25, k*0.6);           // dazed by the quake
      else if (e.slowT > 0) _ec.setRGB(k*0.6, k*0.85, k*1.35);          // frost tint
      else if (G.event?.id === 'goldrush') _ec.setRGB(k*1.25, k*1.1, k*0.7);

function hpScale(){ return 1 + G.t/60 * 0.42; }
function dmgScale(){ return 1 + G.t/140 * 0.35; }
// elites & bosses get bespoke curves: approachable early, monstrous late
function eliteHpAt(t){ return Math.round((180 + t * 1.2) * (0.6 + 0.4 * hpScale())); }
function bossHpAt(t){ return Math.round((2200 + t * 3.5) * (0.55 + 0.35 * hpScale())); }

function spawnEnemy(type, posOverride, force = false) {
  // the horde cap grows over the run so late-game escalation stays real
  const cap = 260 + Math.min(120, Math.floor(G.t / 12));
  if (!force && enemies.length > cap && !ENEMY_TYPES[type].boss && !ENEMY_TYPES[type].elite) return;
  const def = ENEMY_TYPES[type];
  const pool = enemyPools[type];
  if (pool.list.length >= ENEMY_POOL_MAX[type]) return;
  const mesh = new THREE.Object3D(); // pooled instance transform — not a scene object
  mesh.scale.setScalar(def.scale);
  let x, z;
  if (posOverride) { x = posOverride.x; z = posOverride.z; }
  else {
    const a = Math.random()*Math.PI*2;
    const d = 34 + Math.random()*12;
    x = THREE.MathUtils.clamp(P.pos.x + Math.cos(a)*d, -WORLD, WORLD);
    z = THREE.MathUtils.clamp(P.pos.z + Math.sin(a)*d, -WORLD, WORLD);
  }
  const gy = terrainH(x, z);
  mesh.position.set(x, gy, z);
  const e = {
    type, def, mesh, gy,
    tint: 0.9 + Math.random()*0.2,
    hp: def.elite ? eliteHpAt(G.t) : def.boss ? bossHpAt(G.t) : def.hp * hpScale(),
    maxhp: 0,
    kb: new THREE.Vector3(),
    flash: 0, hitCd: {}, contactCd: 0, slowT: 0, slowMult: 0.55, stunT: 0, shootCd: 1.6,
    bob: Math.random()*Math.PI*2,
    spawnT: def.boss ? 0.9 : 0.4, fuse: 0, blinkCd: 3 + Math.random()*2, blinkT: 0, blinkTo: null,
  };
  e.maxhp = e.hp;
  e.poolIdx = pool.list.length;
  pool.list.push(e);
  enemies.push(e);
  if (def.boss) { G.boss = e; Sfx.bossroar(); document.getElementById('bossWrap').style.display='block'; }
  if ((def.bomber || def.armor || def.blink) && !G.seenTypes.has(type)) {
    G.seenTypes.add(type);
    showToast(R.fmt(T.newEnemy, { name: T.enemies[type] }));
  }
  return e;
}

function killEnemy(e, idx) {
  freeEnemy(e);
  enemies.splice(idx, 1);
  G.kills++;
  if (P.lifesteal) P.hp = Math.min(P.maxhp, P.hp + P.lifesteal);
  // combo: chained kills build a counter; every 50 pays out bonus gold
  G.combo++; G.comboT = 2.0;
  if (G.combo % 50 === 0) {
    const bonus = Math.round(12 * goldMult());
    G.gold += bonus;
    showDamage(P.pos, R.fmt(T.rampage, { n: bonus }), '#ffd23e', 22);
    Sfx.gold();
  }
  burst(e.mesh.position, e.def.color, e.def.boss ? 26 : e.def.elite ? 16 : 7, 6);
  const p = e.mesh.position;
  if (e.def.bomber) G.blasts.push({ x: p.x, z: p.z, y: e.gy, r: e.def.blast, hurtsPlayer: false });
  if (e.def.boss) {
    // bosses are worth the fight: gem shower, big gold, a vacuum, a snack and a treasure chest
    for (let i = 0; i < 8; i++) dropGem(p, 10, true);
    for (let i = 0; i < 8; i++) dropGold(p);
    dropVacuum(p);
    pushPickup('food', 0, new THREE.Mesh(foodGeo, foodMat), p.x + 2, p.z);
    dropChest(p, true);
    // hand the HP bar to any boss still alive
    G.boss = enemies.find(x => x.def.boss) || null;
    if (G.boss) document.getElementById('bossName').textContent = G.boss.bossName || 'BOSS';
    document.getElementById('bossWrap').style.display = G.boss ? 'block' : 'none';
  } else if (e.def.elite) {
    for (let i = 0; i < 4; i++) dropGem(p, 5, true);
    dropGold(p);
    dropChest(p, false);
    showDamage(p, T.chest, '#ffd23e', 22);
  } else {
    dropGem(p, e.def.xp);
    // gold rate tapers late so an endless-horde run can't trivialize the meta economy
    const goldChance = G.event?.id === 'goldrush' ? 0.35 : 0.06 * Math.min(1, 600 / Math.max(1, G.t));
    if (Math.random() < goldChance) dropGold(p);
    if (Math.random() < 0.01) dropHeart(p);
    if (Math.random() < 0.004) dropVacuum(p);
  }
}

function damageEnemy(e, amount, sourcePos, isCritAllowed = true, quiet = false) {
  let crit = false;
  if (isCritAllowed && Math.random() < P.crit) { amount *= 2; crit = true; }
  amount = e.def.armor ? R.armorDamage(amount, e.def.armor) : Math.round(amount);
  e.hp -= amount;
  e.flash = quiet ? Math.max(e.flash, 0.05) : 0.12;
  if (quiet) return;
  showDamage(e.mesh.position, amount, crit ? '#ffb02e' : e.def.armor ? '#b8c6dc' : '#ffffff', crit ? 22 : 16 + Math.min(6, amount/20));
  if (crit) { Sfx.crit(); G.hitstop = 0.05; burst(e.mesh.position, 0xffe9a0, 4, 6, 5); }
  else Sfx.hit();
  if (sourcePos && !e.def.boss) {
    _v.copy(e.mesh.position).sub(sourcePos); _v.y = 0;

}

function hurtPlayer(raw, attacker = null) {
  const dmg = Math.max(1, Math.round(raw) - P.armor);

  P.invuln = 0.7;
  G.shake = Math.max(G.shake, 0.3);

  document.getElementById('vignette').style.opacity = 1;
  if (attacker && P.thorns > 0) damageEnemy(attacker, raw * P.thorns, P.pos, false);

}

// Guardian Angel: one free revive with a shockwave, otherwise the run ends
function checkDeath() {
  if (P.hp > 0 || G.state !== 'play') return;
  if (P.revives > 0) {
    P.revives--;
    P.hp = P.maxhp * 0.5;
    P.invuln = 2.5;

  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    const d = Math.hypot(g.m.position.x - P.pos.x, g.m.position.z - P.pos.z);
    if (!g.fly && d > 70) continue; // far gems sit still in the fog — skip cosmetic updates
    g.m.rotation.y += dt * 3;
    if (!g.fly) g.m.position.y = g.baseY + Math.sin(G.t*4 + i)*0.12;
    if (!g.fly && d < P.magnet) g.fly = true;
    if (g.fly) {
      _v.set(P.pos.x - g.m.position.x, P.pos.y + 0.9 - g.m.position.y, P.pos.z - g.m.position.z);
      const dist = _v.length();
      if (dist < 0.9) {

        else if (g.kind === 'gold') {
          const got = Math.round(g.value * goldMult());
          G.gold += got; Sfx.gold();

        }
        else if (g.kind === 'vacuum') {
          for (const o of gems) o.fly = true;
          Sfx.levelup();

        }
        else if (g.kind === 'chest') {
          G.pendingChests.push(g.value === 1);

        }
        else if (g.kind === 'food') {
          const heal = Math.round(P.maxhp * 0.25);

          showDamage(P.pos, '+' + heal + ' HP', '#7dff6a', 20);

      g.m.position.addScaledVector(_v.normalize(), Math.max(14, dist*6) * dt);

}

function spawnPot() {
  let x = 0, z = 0, tries = 0;
  do {
    // scatter within reach of the player — the world is far bigger than the play bubble
    const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 65;
    x = THREE.MathUtils.clamp(P.pos.x + Math.cos(a) * d, -WORLD + 6, WORLD - 6);
    z = THREE.MathUtils.clamp(P.pos.z + Math.sin(a) * d, -WORLD + 6, WORLD - 6);
    tries++;
  } while (tries < 25 && (Math.hypot(x - P.pos.x, z - P.pos.z) < 22 ||
           pots.some(p => Math.hypot(p.m.position.x - x, p.m.position.z - z) < 14)));
  const m = new THREE.Mesh(potGeo, potMat);
  m.position.set(x, terrainH(x, z), z);
  m.rotation.y = Math.random() * Math.PI;
  m.castShadow = true;
  scene.add(m);
  pots.push({ m });
}

function breakPotsNear(x, z, r, y = null) {
  for (let i = pots.length - 1; i >= 0; i--) {
    const pot = pots[i];
    const dx = pot.m.position.x - x, dz = pot.m.position.z - z;
    if (dx*dx + dz*dz > (r + 0.8) ** 2) continue;
    if (y !== null && Math.abs(pot.m.position.y - y) > 3) continue;
    pots.splice(i, 1);
    scene.remove(pot.m);
    burst(pot.m.position, 0xc4763f, 11, 5, 4);
    Sfx.pot();
    const m = new THREE.Mesh(foodGeo, foodMat);
    pushPickup('food', 0, m, pot.m.position.x, pot.m.position.z);
    showDamage(pot.m.position, T.food, '#7dff6a', 18);
    potQueue.push(G.t + 26 + Math.random() * 18);
  }
}

function updatePots() {
  while (potQueue.length && G.t >= potQueue[0]) { potQueue.shift(); spawnPot(); }
  // pots the player left far behind quietly relocate back into range
  for (let i = pots.length - 1; i >= 0; i--) {
    const p = pots[i];
    if (Math.hypot(p.m.position.x - P.pos.x, p.m.position.z - P.pos.z) > 140) {
      scene.remove(p.m);
      pots.splice(i, 1);
      spawnPot();
    }
  }
}

  if (G.event?.id === 'bloodmoon') v *= 2;

  while (P.xp >= P.xpNext) {

  }
}

const _bq = new THREE.Quaternion(), _up = new THREE.Vector3(0, 1, 0), _bd = new THREE.Vector3();

function nearestEnemy(maxDist = 26) {
  let best = null, bd = maxDist*maxDist;
  for (const e of enemies) {
    const dx = e.mesh.position.x - P.pos.x, dz = e.mesh.position.z - P.pos.z;
    const d2 = dx*dx + dz*dz;
    if (d2 < bd) { bd = d2; best = e; }
  }
  return best;
}

function nearestTo(src, hop, exclude) {
  let best = null, bd = hop * hop;
  for (const o of enemies) {
    if (exclude.has(o)) continue;
    const dx = o.mesh.position.x - src.mesh.position.x, dz = o.mesh.position.z - src.mesh.position.z;
    const d2 = dx*dx + dz*dz;
    if (d2 < bd) { bd = d2; best = o; }
  }
  return best;
}
function randomNearEnemy(maxDist) {
  const near = enemies.filter(e => Math.hypot(e.mesh.position.x - P.pos.x, e.mesh.position.z - P.pos.z) < maxDist);
  return near.length ? near[Math.floor(Math.random() * near.length)] : null;

const _from = new THREE.Vector3(), _to = new THREE.Vector3(), _tmpV = new THREE.Vector3(), _tmpV2 = new THREE.Vector3();
// Chain Spark / Thunder God: hop from cube to cube, never the same one twice
function chainFrom(start, jumps, dmg, hop, origin, alreadyHit = []) {
  const hit = new Set(alreadyHit);
  let cur = start;
  _from.copy(origin);
  for (let j = 0; j < jumps && cur; j++) {
    hit.add(cur);
    _to.set(cur.mesh.position.x, cur.gy + 1.1, cur.mesh.position.z);
    addBolt(_from, _to);
    burst(cur.mesh.position, 0xbff4ff, 2, 3);
    damageEnemy(cur, dmg, null);
    _from.copy(_to);
    const next = nearestTo(cur, hop, hit);
    if (cur.hp <= 0) { const idx = enemies.indexOf(cur); if (idx >= 0) killEnemy(cur, idx); }
    cur = next;
  }
}

      scene.add(ring);
      rings.push({ m: ring, life: 0.45, max: 0.45, r: s.r });
      if (evo) { addRing(P.pos, 0xffffff, s.r * 0.7, 0.55); burst(P.pos, 0xe8f8ff, 14, 9, 4); }
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const d = Math.hypot(e.mesh.position.x - P.pos.x, e.mesh.position.z - P.pos.z);
        if (d < s.r + e.def.r && Math.abs(e.gy - P.pos.y) < 2.4) {
          e.slowT = Math.max(e.slowT, s.slow);
          e.slowMult = s.slowMult;
          damageEnemy(e, s.dmg * P.dmgMult, null);
          if (e.hp <= 0) killEnemy(e, i);
        }
      }
      Sfx.zap();
    }
    else if (id === 'rail') {
      const tgt = nearestEnemy(30);
      if (!tgt) { w.timer = 0.15; continue; }
      w.timer = s.cd * P.cdMult;
      P.attackT = 0.32;
      const base = Math.atan2(tgt.mesh.position.x - P.pos.x, tgt.mesh.position.z - P.pos.z);
      for (let k = 0; k < s.n; k++) {
        const m = new THREE.Mesh(railGeo, railMat);
        m.add(new THREE.Mesh(railHaloGeo, railHaloMat));
        m.position.set(P.pos.x, P.pos.y + 1.2, P.pos.z);
        const a = base + k * Math.PI * 2 / s.n;
        m.rotation.y = a;
        scene.add(m);
        projectiles.push({ kind: 'rail', m, dir: new THREE.Vector3(Math.sin(a), 0, Math.cos(a)), speed: 30, life: s.range / 30, dmg: s.dmg, hitMap: new Set() });
      }
      Sfx.zap();
    }
    else if (id === 'chain') {
      let fired = 0;
      const used = new Set();
      for (let c = 0; c < s.n; c++) {
        const first = c === 0 ? nearestEnemy(16) : randomNearEnemy(16);
        if (!first || used.has(first)) continue;
        used.add(first);
        chainFrom(first, s.jumps, s.dmg * P.dmgMult, s.hop, _tmpV.set(P.pos.x, P.pos.y + 1.3, P.pos.z));
        fired++;
      }
      w.timer = fired ? s.cd * P.cdMult : 0.15;
      if (fired) { Sfx.zap(); P.attackT = 0.32; }
    }
    else if (id === 'blades') {
      if (!enemies.length) { w.timer = 0.2; continue; }
      w.timer = s.cd * P.cdMult;
      const base = Math.random() * Math.PI * 2;
      for (let k = 0; k < s.n; k++) {
        const m = new THREE.Mesh(bladeGeo, evo ? bladeMatEvo : bladeMat);
        if (evo) m.scale.setScalar(1.35);
        scene.add(m);
        projectiles.push({ kind: 'blade', m, a: base + k / s.n * Math.PI * 2, t: 0, life: s.life, dur: s.life, reach: s.reach, dmg: s.dmg, hitT: new Map() });
      }
      Sfx.saw();
    }
    else if (id === 'poison') {
      const near = enemies.filter(e => Math.hypot(e.mesh.position.x - P.pos.x, e.mesh.position.z - P.pos.z) < 14);
      if (!near.length) { w.timer = 0.2; continue; }
      w.timer = s.cd * P.cdMult;
      for (let k = 0; k < s.n; k++) {
        const e = near[Math.floor(Math.random() * near.length)];
        spawnPuddle(e.mesh.position.x + (Math.random()-0.5)*1.5, e.mesh.position.z + (Math.random()-0.5)*1.5, s.r, s.dmg * P.dmgMult, s.dur, evo ? 0xb6ff3a : 0x6ad84a);
      }
      Sfx.poison();
    }
    else if (id === 'meteor') {
      const near = enemies.filter(e => Math.hypot(e.mesh.position.x - P.pos.x, e.mesh.position.z - P.pos.z) < 22);
      if (!near.length) { w.timer = 0.2; continue; }
      w.timer = s.cd * P.cdMult;
      for (let k = 0; k < s.n; k++) {
        const e = near[Math.floor(Math.random() * near.length)];
        dropMeteor(e.mesh.position.x + (Math.random()-0.5)*2, e.mesh.position.z + (Math.random()-0.5)*2, s.r, s.dmg * P.dmgMult, s.delay + k * 0.12, false);
      }
    }
  }
}

/* ---------- lingering clouds: Toxic Cloud, and Inferno's burning ground ---------- */
const puddles = [];
// soft swirling cloud on the ground instead of a flat disc
function puddleMaterial(color) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uOpacity: { value: 0 }, uTime: waterMat.uniforms.uTime },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `
      uniform vec3 uColor; uniform float uOpacity, uTime; varying vec2 vUv;
      void main() {
        vec2 p = vUv - 0.5; float r = length(p) * 2.0; float a = atan(p.y, p.x);
        float swirl = 0.5 + 0.5 * sin(a * 5.0 + r * 9.0 - uTime * 2.5);
        float body = smoothstep(1.0, 0.35, r) * (0.55 + 0.45 * swirl);
        float edge = smoothstep(0.75, 0.92, r) * smoothstep(1.0, 0.92, r);
        gl_FragColor = vec4(uColor * (body + edge * 1.4), 1.0) * uOpacity;
      }`,
  });
}
function spawnPuddle(x, z, r, dps, dur, color) {
  if (puddles.length > 40) return;
  const m = new THREE.Mesh(puddleGeo, puddleMaterial(color));
  m.position.set(x, terrainH(x, z) + 0.08, z);
  m.scale.setScalar(0.1);
  scene.add(m);
  puddles.push({ m, x, z, r, dps, life: dur, max: dur, tick: 0, bubble: 0, color });
}
function updatePuddles(dt) {
  for (let i = puddles.length - 1; i >= 0; i--) {
    const p = puddles[i];
    p.life -= dt;
    const age = p.max - p.life;
    p.m.scale.setScalar(p.r * Math.min(1, age * 5) * (1 + Math.sin(G.t * 6 + i) * 0.04));
    p.m.material.uniforms.uOpacity.value = 0.75 * Math.min(1, p.life / 0.5);
    p.bubble -= dt;
    if (p.bubble <= 0) {
      p.bubble = 0.22;
      burst(_tmpV2.set(p.x + (Math.random()-0.5)*p.r, p.m.position.y - 0.6, p.z + (Math.random()-0.5)*p.r), p.color, 1, 0.6, 2.4);
    }
    p.tick -= dt;
    if (p.tick <= 0) {
      p.tick = 0.25;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        const dx = e.mesh.position.x - p.x, dz = e.mesh.position.z - p.z;
        if (dx*dx + dz*dz < (p.r + e.def.r * 0.5) ** 2) {
          damageEnemy(e, p.dps * 0.25, null, false, true);
          if (e.hp <= 0) killEnemy(e, j);
        }
      }
    }
    if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); puddles.splice(i, 1); }
  }
}

/* ---------- meteors: telegraphed ring, falling rock, big impact ---------- */
const meteors = [];
function dropMeteor(x, z, r, dmg, delay, hurtsPlayer) {
  const gy = terrainH(x, z);
  const warn = new THREE.Mesh(warnGeo, new THREE.MeshBasicMaterial({ color: hurtsPlayer ? 0xff3a3a : 0xffa040, transparent: true, opacity: 0.8, depthWrite: false }));
  warn.position.set(x, gy + 0.12, z);
  warn.scale.setScalar(r);
  const rock = new THREE.Mesh(meteorGeo, meteorMat);
  rock.add(new THREE.Mesh(meteorHaloGeo, meteorHaloMat));
  rock.position.set(x + 8, gy + 34, z - 4);
  scene.add(warn, rock);
  meteors.push({ x, z, gy, r, dmg, t: delay, total: delay, warn, rock, hurtsPlayer, trail: 0 });
  Sfx.whistle();
}
function updateMeteors(dt) {
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.t -= dt;
    const k = 1 - Math.max(0, m.t) / m.total;
    m.rock.position.set(m.x + 8 * (1 - k), m.gy + 34 * (1 - k) + 0.5, m.z - 4 * (1 - k));
    m.rock.rotation.x += dt * 7; m.rock.rotation.z += dt * 5;
    m.warn.material.opacity = 0.35 + Math.sin(G.t * 20) * 0.2 + k * 0.35;
    m.trail -= dt;
    if (m.trail <= 0) { m.trail = 0.04; burst(_tmpV2.copy(m.rock.position).setY(m.rock.position.y - 0.8), 0xff8a3a, 1, 1.5, 0.5); }
    if (m.t > 0) continue;
    scene.remove(m.warn, m.rock);
    m.warn.material.dispose();
    meteors.splice(i, 1);
    _tmpV2.set(m.x, m.gy, m.z);
    burst(_tmpV2, 0xff7a2a, 16, 9, 6);
    burst(_tmpV2, 0x5a3a2a, 8, 6, 5);
    addRing(_tmpV2, 0xffa040, m.r * 1.1, 0.45);
    G.shake = Math.max(G.shake, 0.22);
    Sfx.boom();
    breakPotsNear(m.x, m.z, m.r, m.gy);
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const dx = e.mesh.position.x - m.x, dz = e.mesh.position.z - m.z;
      if (dx*dx + dz*dz < (m.r + e.def.r) ** 2 && Math.abs(e.gy - m.gy) < 3) {
        damageEnemy(e, m.dmg, _tmpV2);
        if (e.hp <= 0) killEnemy(e, j);
      }
    }
    if (m.hurtsPlayer && P.invuln <= 0 && Math.hypot(P.pos.x - m.x, P.pos.z - m.z) < m.r * 0.85 && P.pos.y - m.gy < 1.5) hurtPlayer(16 * dmgScale());
    if (G.state !== 'play') return;
  }
}

/* ---------- bomb blasts: queued so chain reactions never mutate an enemy loop mid-iteration ---------- */
function updateBlasts() {
  while (G.blasts.length) {
    const b = G.blasts.shift();
    _tmpV2.set(b.x, b.y, b.z);
    burst(_tmpV2, 0xff7a3d, 18, 9, 6);
    burst(_tmpV2, 0xffe14d, 8, 7, 5);
    addRing(_tmpV2, 0xff7a3d, b.r, 0.4);
    G.shake = Math.max(G.shake, 0.25);
    Sfx.blast();
    const dmg = 30 + G.t * 0.05;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const dx = e.mesh.position.x - b.x, dz = e.mesh.position.z - b.z;
      if (dx*dx + dz*dz < (b.r + e.def.r) ** 2 && Math.abs(e.gy - b.y) < 3) {
        damageEnemy(e, dmg, _tmpV2, false);
        if (e.hp <= 0) killEnemy(e, j);
      }
    }
    if (b.hurtsPlayer && P.invuln <= 0 && Math.hypot(P.pos.x - b.x, P.pos.z - b.z) < b.r && P.pos.y - b.y < 1.6) {
      hurtPlayer(ENEMY_TYPES.bomber.blastDmg * dmgScale());
    }
    if (G.state !== 'play') return;
  }
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= dt;
    let dead = p.life <= 0;

    if (p.kind === 'fire') {
      p.m.position.addScaledVector(p.dir, p.speed * dt);
      // hug the terrain so it works up and down hills
      const fy = terrainH(p.m.position.x, p.m.position.z) + 1.2;
      p.m.position.y += (fy - p.m.position.y) * Math.min(1, dt * 5);
      p.m.rotation.y += dt*8;
      p.trail -= dt;
      if (p.trail <= 0) { p.trail = 0.05; burst(p.m.position, 0xff8830, 1, 1.2, 0.8); }
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        const dx = p.m.position.x - e.mesh.position.x, dz = p.m.position.z - e.mesh.position.z;
        if (Math.hypot(dx, dz) < e.def.r + 0.6 && Math.abs(p.m.position.y - (e.gy + 0.9)) < 1.8) {
          Sfx.boom(); G.shake = Math.max(G.shake, 0.15);
          burst(p.m.position, 0xff7722, 12, 7);
          breakPotsNear(p.m.position.x, p.m.position.z, p.boom, p.m.position.y);
          if (p.burn) spawnPuddle(p.m.position.x, p.m.position.z, p.boom * 0.7, p.dmg * 0.3 * P.dmgMult, p.burn, 0xff7a2a);
          for (let q = enemies.length - 1; q >= 0; q--) {
            const e2 = enemies[q];
            const dx2 = p.m.position.x - e2.mesh.position.x, dz2 = p.m.position.z - e2.mesh.position.z;
            if (Math.hypot(dx2, dz2) < p.boom + e2.def.r && Math.abs(e2.gy - e.gy) < 3) {
              damageEnemy(e2, p.dmg * P.dmgMult, p.m.position);
              if (e2.hp <= 0) killEnemy(e2, q);
            }
          }
          dead = true;
          break;
        }
      }
    }
    else if (p.kind === 'boom') {
      p.m.rotation.y += dt * 14;
      if (!p.returning) {
        p.m.position.addScaledVector(p.dir, p.speed * dt);
        p.traveled += p.speed * dt;
        if (p.traveled >= p.range) { p.returning = true; p.hitMap.clear(); }
      } else {
        _v.set(P.pos.x - p.m.position.x, 0, P.pos.z - p.m.position.z);
        const d = _v.length();
        if (d < 1.0) dead = true;
        else p.m.position.addScaledVector(_v.normalize(), (p.speed + 4) * dt);
      }
      const by = terrainH(p.m.position.x, p.m.position.z) + 1.3;
      p.m.position.y += (by - p.m.position.y) * Math.min(1, dt * 5);
      breakPotsNear(p.m.position.x, p.m.position.z, 0.8, p.m.position.y);
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (p.hitMap.has(e)) continue;
        const dx = p.m.position.x - e.mesh.position.x, dz = p.m.position.z - e.mesh.position.z;
        if (Math.hypot(dx, dz) < e.def.r + p.size && Math.abs(p.m.position.y - (e.gy + 0.9)) < 1.8) {
          p.hitMap.add(e);
          damageEnemy(e, p.dmg * P.dmgMult, p.m.position);
          if (e.hp <= 0) killEnemy(e, j);
        }
      }
    }

    else if (p.kind === 'blade') {
      p.t += dt;
      const rad = 1.2 + (p.reach - 1.2) * Math.min(1, p.t / p.dur);
      const a = p.a + p.t * 4.2;
      const bx = P.pos.x + Math.cos(a) * rad, bz = P.pos.z + Math.sin(a) * rad;
      p.m.position.set(bx, Math.max(terrainH(bx, bz) + 1.0, P.pos.y + 0.9), bz);
      p.m.rotation.y += dt * 22;
      breakPotsNear(bx, bz, 0.8, p.m.position.y);
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if ((p.hitT.get(e) || 0) > G.t) continue;
        const dx = bx - e.mesh.position.x, dz = bz - e.mesh.position.z;
        if (dx*dx + dz*dz < (e.def.r + 0.6) ** 2 && Math.abs(p.m.position.y - (e.gy + 0.9)) < 2) {
          p.hitT.set(e, G.t + 0.3);
          damageEnemy(e, p.dmg * P.dmgMult, p.m.position);
          if (e.hp <= 0) killEnemy(e, j);
        }
      }
    }

    else if (p.kind === 'rail') {
      p.m.position.addScaledVector(p.dir, p.speed * dt);
      const ry = terrainH(p.m.position.x, p.m.position.z) + 1.2;
      p.m.position.y += (ry - p.m.position.y) * Math.min(1, dt * 8);
      breakPotsNear(p.m.position.x, p.m.position.z, 0.7, p.m.position.y);
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (p.hitMap.has(e)) continue;
        const dx = p.m.position.x - e.mesh.position.x, dz = p.m.position.z - e.mesh.position.z;
        if (Math.hypot(dx, dz) < e.def.r + 0.7 && Math.abs(p.m.position.y - (e.gy + 0.9)) < 1.9) {
          p.hitMap.add(e);
          damageEnemy(e, p.dmg * P.dmgMult, null);
          if (e.hp <= 0) killEnemy(e, j);
        }
      }
    }

    if (dead) { scene.remove(p.m); projectiles.splice(i, 1); }
  }

  // orbs
  if (P.weapons.orbs) {
    const s = wStats('orbs');
    if (orbMeshes.length !== s.n) syncOrbs();
    orbAngle += dt * s.speed;
    for (let k = 0; k < orbMeshes.length; k++) {
      const a = orbAngle + (k / orbMeshes.length) * Math.PI * 2;
      const ox = P.pos.x + Math.cos(a) * s.r, oz = P.pos.z + Math.sin(a) * s.r;
      const oy = P.pos.y + 1.3 + Math.sin(a*2)*0.2;
      orbMeshes[k].position.set(ox, oy, oz);
      breakPotsNear(ox, oz, 0.85, oy);
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        const key = 'orb' + k;
        if ((e.hitCd[key] || 0) > G.t) continue;
        if (Math.abs(oy - (e.gy + 0.9)) > 1.9) continue;
        const dx = e.mesh.position.x - ox, dz = e.mesh.position.z - oz;
        if (dx*dx + dz*dz < (e.def.r + 0.5) ** 2) {
          e.hitCd[key] = G.t + 0.5;
          damageEnemy(e, s.dmg * P.dmgMult, orbMeshes[k].position);
          if (e.hp <= 0) killEnemy(e, j);
        }
      }
    }
  }

  // transient visuals
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i]; b.life -= dt;
    b.m.material.opacity = Math.max(0, b.life / 0.18);
    if (b.life <= 0) { scene.remove(b.m); b.m.material.dispose(); beams.splice(i, 1); }
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.life -= dt;
    const t = 1 - r.life / r.max;
    r.m.scale.setScalar(0.4 + t * r.r);
    r.m.material.opacity = 1 - t;
    if (r.life <= 0) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); }
  }
}

/* ============================================================
   UPGRADES / LEVEL-UP CARDS
============================================================ */
const rulesState = () => ({ weapons: P.weapons, passives: P.passives, evolved: P.evolved });

function cardHTML(c) {
  const mods = { extra: P.extra, area: P.area };
  if (c.kind === 'evolution') {
    return { cls: 'evolution', html: `<div class="upEmoji">${R.EVOLUTION_EMOJI[c.id]}</div><div class="upName">${T.evolutions[c.id].name}</div>
      <div class="upLvl">${R.fmt(T.evolveHint, { weapon: T.weapons[c.id].name, passive: passiveName(R.EVOLUTIONS[c.id]) })}</div>
      <div class="upDesc">${R.describeWeapon(LANG, c.id, R.MAX_LEVEL, { ...mods, evolved: true })}</div><div class="upTag">${T.tagEvolution}</div>` };
  }
  if (c.kind === 'weapon') {
    const isNew = c.level === 1;
    return { cls: 'weapon', html: `${isNew ? `<div class="ribbon">${T.cardNew}</div>` : ''}<div class="upEmoji">${R.WEAPON_EMOJI[c.id]}</div><div class="upName">${T.weapons[c.id].name}</div>
      <div class="upLvl">${isNew ? '&nbsp;' : R.fmt(T.cardLevel, { from: c.level - 1, to: c.level })}</div>
      <div class="upDesc">${R.describeWeapon(LANG, c.id, c.level, mods)}</div>
      <div class="upHint">${R.fmt(T.evolvesWith, { passive: passiveName(R.EVOLUTIONS[c.id]) })}</div><div class="upTag">${T.tagWeapon}</div>` };
  }
  const def = PASSIVE_BY_ID[c.id], owned = P.passives[c.id] || 0;
  const lvl = owned ? R.fmt(T.cardOwned, { n: owned }) : def.max ? R.fmt(T.cardMax, { n: def.max }) : '&nbsp;';
  return { cls: 'passive', html: `<div class="upEmoji">${def.emoji}</div><div class="upName">${T.passives[c.id].name}</div>
    <div class="upLvl">${lvl}</div><div class="upDesc">${T.passives[c.id].desc}</div><div class="upTag">${T.tagPassive}</div>` };
}

function applyChoice(c) {
  if (c.kind === 'weapon') P.weapons[c.id] = c.level;
  else if (c.kind === 'passive') { PASSIVE_BY_ID[c.id].apply(P); P.passives[c.id] = (P.passives[c.id] || 0) + 1; }
  else if (c.kind === 'evolution') {
    P.evolved[c.id] = true;
    G.evolutions++;
    W[c.id].timer = 0;
    Sfx.evolve();
    flashScreen(0.6);
    showToast(`${R.EVOLUTION_EMOJI[c.id]} ${T.evolutions[c.id].name}!`, true);
  }
  syncOrbs();
  refreshWeaponTray();
}

function clearDamageNumbers() { for (const s of dmgPool) { s.life = 0; s.el.style.display = 'none'; } }
function showToast(text, gold = false) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'glass' + (gold ? ' gold' : '');
  void el.offsetWidth; // restart the CSS animation
  el.classList.add('show');
}
function flashScreen(opacity) {
  const el = document.getElementById('flash');
  el.style.transition = 'none';
  el.style.opacity = opacity;
  void el.offsetWidth;
  el.style.transition = '';
  el.style.opacity = 0;
}

function showLevelup() {
  G.state = 'levelup';
  clearDamageNumbers(); // don't leave numbers frozen over the menu
  document.getElementById('levelup').style.display = 'flex';
  document.getElementById('lvluptitle').textContent = G.pendingLevelups > 1 ? R.fmt(T.levelUpMulti, { n: G.pendingLevelups }) : T.levelUp;
  const row = document.getElementById('cardRow');
  row.innerHTML = '';
  for (const c of R.rollCards(rulesState(), Math.random)) {
    const div = document.createElement('div');
    const { cls, html } = cardHTML(c);
    div.className = 'upCard glass ' + cls;
    div.innerHTML = html;
    div.onclick = () => { if (G.state !== 'levelup') return; applyChoice(c); pickCard(); };
    row.appendChild(div);
  }
}
function pickCard() {
  Sfx.pick();
  G.pendingLevelups = Math.max(0, G.pendingLevelups - 1);
  refreshWeaponTray();
  if (G.pendingLevelups > 0 && G.state === 'levelup') { showLevelup(); return; }
  document.getElementById('levelup').style.display = 'none';
  if (G.state === 'levelup') G.state = 'play'; // never un-pause a dead/won run
}

// treasure chest: contents are applied at once and shown as cards
function showChest() {
  const boss = G.pendingChests.shift();
  G.state = 'chest';
  clearDamageNumbers();
  const roll = R.rollChest(rulesState(), Math.random, { boss });
  document.getElementById('chestTitle').textContent = boss ? T.chestBossTitle : T.chestTitle;
  const icon = document.getElementById('chestIcon');
  icon.style.animation = 'none'; void icon.offsetWidth; icon.style.animation = '';
  const row = document.getElementById('chestRow');
  row.innerHTML = '';
  for (const c of roll.items) {
    const { cls, html } = cardHTML(c);
    const div = document.createElement('div');
    div.className = 'upCard glass static ' + cls;
    div.innerHTML = html;
    row.appendChild(div);
    applyChoice(c);
  }
  const gold = Math.round(roll.gold * goldMult());
  G.gold += gold;
  document.getElementById('chestGold').textContent = '🪙 ' + R.fmt(T.chestGold, { n: gold });
  document.getElementById('chestScr').style.display = 'flex';
  Sfx.chest();
}
function closeChest() {
  if (G.state !== 'chest') return;
  document.getElementById('chestScr').style.display = 'none';
  Sfx.pick();
  G.state = 'play';
}
document.getElementById('chestBtn').onclick = closeChest;

function refreshWeaponTray() {
  const tray = document.getElementById('weaponTray');
  tray.innerHTML = '';
  const ready = new Set(R.readyEvolutions(rulesState()));
  for (const id in P.weapons) {
    const lvl = P.weapons[id];
    const d = document.createElement('div');
    d.className = 'wslot glass' + (P.evolved[id] ? ' evolved' : ready.has(id) ? ' ready' : '');
    d.title = `${weaponName(id)} (${lvl}/${R.MAX_LEVEL})`;
    d.innerHTML = `<div class="wicon">${weaponEmoji(id)}</div><div class="lvpips">${Array.from({ length: R.MAX_LEVEL }, (_, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('')}</div>`;
    tray.appendChild(d);
  }
  const ptray = document.getElementById('passiveTray');
  ptray.innerHTML = '';
  for (const id of Object.keys(P.passives)) {
    const chip = document.createElement('div');
    chip.className = 'pchip glass';
    chip.textContent = PASSIVE_BY_ID[id].emoji + (P.passives[id] > 1 ? '×' + P.passives[id] : '');
    chip.title = T.passives[id].name + ' — ' + T.passives[id].desc;
    ptray.appendChild(chip);
  }
  document.getElementById('reviveChip').style.display = P.revives > 0 ? 'block' : 'none';
}
